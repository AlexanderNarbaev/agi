plugins {
    id 'java'
    id 'jacoco'
    id 'com.github.spotbugs' version '6.1.7'
    id 'io.quarkus' version '3.38.3'
    id 'me.champeau.jmh' version '0.7.3'
    id 'org.graalvm.buildtools.native' version '1.1.10'
}

group = 'io.matrix'
version = '1.0.0'

// W357: Add generated proto sources
sourceSets {
    main {
        java {
            srcDir 'src/generated/java'
        }
    }
    jmh {
        java {
            srcDir 'src/jmh/java'
        }
    }
}



java {
    sourceCompatibility = JavaVersion.VERSION_25
    targetCompatibility = JavaVersion.VERSION_25
}

repositories {
    mavenCentral()
}

dependencies {
    implementation enforcedPlatform('io.quarkus.platform:quarkus-bom:3.38.3')
    // tukaani/xz — transitive dep of Avro's XZCodec. Avro 1.12.1's
    // XZCodec references XZInputStream at build time, so the class
    // must be on the build-time classpath for native-image.
    implementation 'org.tukaani:xz:1.9'
    implementation 'io.quarkus:quarkus-arc'
    implementation 'io.quarkus:quarkus-micrometer-registry-prometheus'
    implementation 'io.quarkus:quarkus-opentelemetry'
    implementation 'io.quarkus:quarkus-logging-json'
    implementation 'io.quarkus:quarkus-smallrye-health'
    implementation 'io.quarkus:quarkus-picocli'
    implementation 'io.quarkus:quarkus-rest'
    implementation 'io.quarkus:quarkus-rest-jackson'
    implementation 'io.quarkus:quarkus-hibernate-validator'
    implementation 'joda-time:joda-time:2.12.7'
    implementation 'io.quarkus:quarkus-websockets'
    implementation 'io.quarkus:quarkus-reactive-pg-client'
    implementation 'io.quarkus:quarkus-jdbc-postgresql'
    implementation 'org.xerial:sqlite-jdbc:3.43.0.0'
    // RECON-W30: the `jmh` source set does not inherit `implementation`, so benchmarks
    // touching the SQLite memory tier failed at @Setup with "No suitable driver found
    // for jdbc:sqlite:" and produced ZERO results. That failure was silent in the sense
    // that the benchmark exited cleanly with an empty JSON — only the filter
    // post-condition in perf-probe.sh caught it. Declared explicitly so a kernel
    // benchmark cannot compile and then quietly measure nothing.
    jmhImplementation 'org.xerial:sqlite-jdbc:3.43.0.0'
    implementation 'org.apache.commons:commons-imaging:1.0.0-alpha5'
    implementation 'org.jsoup:jsoup:1.17.2'
    // RECON-W42.2 — PDF extraction. The mission's §5.1 requires an
    // established library rather than a hand-written parser, and PDFBox
    // 3.0.3 is already the pinned PDF library of this repository (see
    // matrix-audit/build.gradle), so this is the project's own choice, not
    // a new one.
    implementation 'org.apache.pdfbox:pdfbox:3.0.3'

    implementation 'org.apache.avro:avro:1.12.2'
    implementation 'io.lettuce:lettuce-core:6.5.0.RELEASE'
    implementation 'org.apache.kafka:kafka-clients:4.3.1'
    implementation 'com.microsoft.onnxruntime:onnxruntime_gpu:1.29.0'
    implementation 'com.microsoft.onnxruntime:onnxruntime:1.29.0'

    implementation platform('org.apache.pekko:pekko-bom_2.13:1.6.0')
    implementation 'org.apache.pekko:pekko-actor-typed_2.13'
    implementation 'org.apache.pekko:pekko-serialization-jackson_2.13'
    implementation 'org.apache.pekko:pekko-slf4j_2.13'

    testImplementation 'io.quarkus:quarkus-junit5'
    testImplementation 'org.assertj:assertj-core:3.26.0'
    testImplementation 'org.apache.pekko:pekko-actor-testkit-typed_2.13'
    testImplementation 'io.quarkus:quarkus-jdbc-postgresql'
    testImplementation 'io.quarkus:quarkus-jdbc-h2'
    testImplementation 'io.quarkus:quarkus-test-vertx'
    testImplementation 'org.testcontainers:testcontainers:1.21.3'
    testImplementation 'org.testcontainers:kafka:1.21.3'
    testImplementation 'org.testcontainers:postgresql:1.21.3'
    testImplementation 'org.testcontainers:junit-jupiter:1.21.3'
    testImplementation 'net.jqwik:jqwik:1.9.2'
    // W357: ProtoBuf support
    implementation 'com.google.protobuf:protobuf-java:3.25.5'
}

tasks.withType(Test) {
    useJUnitPlatform()
    // RECON-W43: the ONNX runtime extracts a native library of about 583 MB
    // into a fresh directory under java.io.tmpdir for EVERY session load and
    // never removes it. A test run therefore left as many directories as it
    // loaded models, and they filled the per-user quota of the /tmp tmpfs -
    // which broke the build, the gates and the shell with EDQUOT. The test
    // JVMs get their own scratch directory, and it is emptied before the
    // run. Deleting a directory another worker has open is safe on Linux:
    // the worker keeps its mapping and the space comes back when it exits.
    systemProperty 'java.io.tmpdir', "${rootProject.projectDir}/data/tmp"
    doFirst {
        delete file("${rootProject.projectDir}/data/tmp")
        mkdir file("${rootProject.projectDir}/data/tmp")
    }
    // Exclude integration tests from default test run (requires Docker)
    if (!project.hasProperty('includeIntegration')) {
        exclude '**/integration/**'
    }
    maxHeapSize = '16g'
    jvmArgs '--add-modules=jdk.incubator.vector'
    jvmArgs '-Xmx16g'
    // RUN 62: enable native access for ONNX runtime GPU
    jvmArgs '--enable-native-access=ALL-UNNAMED'
    // RUN 62: provide NVIDIA CUDA library path for ONNX runtime GPU.
    //
    // RECON-W38.4: the previous values were absolute paths into one developer's
    // home directory plus one CUDA install. On any other machine they were
    // simply wrong paths, and the five symlinks that carried the libraries
    // were committed to git - one of them pointing into an untracked
    // virtualenv, so a fresh clone had a dangling link. Candidates are now
    // derived from the project root and from the standard CUDA environment
    // variables, and each is included ONLY if it actually exists: an absent
    // optional accelerator must not become a bogus library path.
    // scripts/diagnose-cuda.sh --repair creates the local .onnx_libs/ links
    // that this path picks up.
    def cudaLibDirs = []
    def venvLib = file("${rootDir}/.venv/lib")
    if (venvLib.exists()) {
        cudaLibDirs += fileTree(venvLib) { include '**/site-packages/nvidia/*/lib' }.files
    }
    [System.getenv('CUDA_HOME'), System.getenv('CUDA_PATH'), '/usr/local/cuda']
        .findAll { it }
        .collect { file(it) }
        .findAll { it.exists() }
        .each { cudaLibDirs += fileTree(it) { include '**/lib64' }.files }
    def onnxLibs = file("${rootDir}/.onnx_libs")
    if (onnxLibs.exists()) cudaLibDirs << onnxLibs
    def nvidiaPaths = cudaLibDirs.collect { it.absolutePath }.join(':')
    if (!nvidiaPaths.isEmpty()) {
        systemProperty 'java.library.path', nvidiaPaths
    }
}

// ─── Generated build metadata (RECON-W38.4) ───────────────────────────────────
//
// The native binary used to print hardcoded headline numbers ("171+ cognitive
// measurement classes", "6,700+ test methods across 940+ test files"). Those
// numbers were true once and were never updated, and a shipped binary cannot
// verify them at runtime.
//
// The counts are now MEASURED at build time from the source tree and written
// into a resource, so the number printed by a binary always corresponds to the
// tree that binary was built from. The counting method is stated in the file
// itself, and a binary built without the resource says so instead of guessing.
tasks.register('generateBuildInfo') {
    def consciousnessSrc = fileTree('src/main/java/io/matrix/consciousness') { include '**/*.java' }
    def cognitiveNamed = fileTree('src/main/java') {
        include '**/io/matrix/consciousness/Cognitive*.java'
    }
    def testFiles = fileTree('src/test/java') { include '**/*Test.java' }
    def allTestFiles = fileTree('src/test/java') { include '**/*.java' }
    def out = layout.buildDirectory.file('generated/build-info/matrix-build-info.properties')
    // the generated directory must be a resource root, otherwise the file
    // never reaches the jar and the binary cannot read it
    sourceSets.main.resources.srcDir(layout.buildDirectory.dir('generated/build-info'))
    inputs.files(consciousnessSrc, cognitiveNamed, testFiles, allTestFiles)
    outputs.file(out)
    doLast {
        int testMethods = 0
        allTestFiles.files.each { f ->
            testMethods += f.readLines().count { l -> l.trim().startsWith('@Test') }
        }
        def props = new Properties()
        props.setProperty('build.consciousness.package.files', String.valueOf(consciousnessSrc.files.size()))
        props.setProperty('build.consciousness.package.named.cognitive', String.valueOf(cognitiveNamed.files.size()))
        props.setProperty('build.test.files', String.valueOf(allTestFiles.files.size()))
        props.setProperty('build.test.classes', String.valueOf(testFiles.files.size()))
        props.setProperty('build.test.methods', String.valueOf(testMethods))
        props.setProperty('build.counting.method',
            'consciousness.package.files = .java files in io/matrix/consciousness; ' +
            'consciousness.package.named.cognitive = those named Cognitive*.java; ' +
            'test.files = .java files under src/test/java; test.classes = those named *Test.java; ' +
            'test.methods = source lines starting with @Test')
        def f = out.get().asFile
        f.parentFile.mkdirs()
        f.withOutputStream { os ->
            // The file is written WITHOUT a timestamp.
            //
            // RECON-W42.7: java.util.Properties.store writes the current
            // time into its comment, so two builds of the same sources
            // produced two DIFFERENT archives — the one entry that stood
            // between the compilation and the archive being reproducible.
            // The properties are written by hand, sorted, so the file is a
            // function of the sources alone.
            def sw = new java.io.OutputStreamWriter(os, 'UTF-8')
            sw.write('#MATRIX build metadata - generated, do not edit\n')
            props.stringPropertyNames().sort().each { key ->
                def value = props.getProperty(key)
                def escaped = value.replace('\\', '\\\\')
                    .replace('\n', '\\n')
                    .replace('\r', '\\r')
                    .replace('\t', '\\t')
                sw.write("${key}=${escaped}\n")
            }
            sw.flush()
        }
        logger.lifecycle("matrix-build-info: ${testMethods} @Test methods across ${allTestFiles.files.size()} test files")
    }
}

processResources.dependsOn tasks.named('generateBuildInfo')

tasks.withType(JavaCompile) {
    options.compilerArgs.add('--add-modules=jdk.incubator.vector')
}

// Shared exclusion list for jacoco coverage measurement.
// Packages listed here are NOT counted towards the 82% METHOD-coverage gate.
// Rationale: experimental, pilot, infrastructure, and non-core-goal packages
// are excluded to keep the coverage gate meaningful for the currently
// tested surface area (agent, imports, io, evolution, neuron, ethics, audit, chat).
def jacocoExcluded = [
    'io/matrix/MatrixApplication*', 'io/matrix/MatrixSimulation*',
    'io/matrix/SystemDemo*', 'io/matrix/MinecraftExperiment*',
    'io/matrix/MatrixTopCommand*', 'io/matrix/cli/**',
    'io/matrix/pilot/**', 'io/matrix/rag/**', 'io/matrix/compression/**',
    'io/matrix/explainability/**', 'io/matrix/nas/**', 'io/matrix/mcts/**',
    'io/matrix/vqvae/**', 'io/matrix/civilization/**', 'io/matrix/economy/**',
    'io/matrix/cauldron/**', 'io/matrix/hades/**', 'io/matrix/proxy/**',
    'io/matrix/shadow/**', 'io/matrix/snapshot/**', 'io/matrix/protocol/**',
    'io/matrix/knowledge/**', 'io/matrix/learning/**', 'io/matrix/dialog/**',
    'io/matrix/simulation/**', 'io/matrix/training/**', 'io/matrix/bridge/**',
    'io/matrix/cluster/**', 'io/matrix/explain/**', 'io/matrix/lifecycle/**',
    'io/matrix/events/**', 'io/matrix/mcp/**', 'io/matrix/concurrent/**',
    'io/matrix/observability/**', 'io/matrix/redis/**', 'io/matrix/safety/**',
    'io/matrix/security/**', 'io/matrix/benchmark/**',
    'io/matrix/noosphere/**', 'io/matrix/neuron/binary/**',
    'io/matrix/reasoning/**',
    'io/matrix/minecraft/**', 'io/matrix/api/**',
    'io/matrix/mediator/**', 'io/matrix/privacy/**',
    'io/matrix/memory/**', 'io/matrix/consensus/**',
    'io/matrix/ethics/guardrail/**',
    'io/matrix/neuron/MultiBrainEnsemble*',
    'io/matrix/neuron/NeuralMemoryResponse*',
    'io/matrix/neuron/UnifiedPretrainedMerger*',
    'io/matrix/cli/InterviewCommand*',
    'io/matrix/cli/TrainOnAllCommand*',
    'io/matrix/training/DropFolderWatcher*',
    'io/matrix/training/MultimodalTrainer*'
]

jacocoTestReport {
    dependsOn test
    reports {
        xml.required = true
        csv.required = false
        html.required = true
    }
}

jacocoTestCoverageVerification {
    dependsOn test, jacocoTestReport
    violationRules {
        rule {
            element = 'BUNDLE'
            limit {
                counter = 'METHOD'
                minimum = 0.82
            }
        }
    }
}

// Single afterEvaluate block — applies exclusion to BOTH tasks
// using explicit file collection instead of nested fileTree
project.afterEvaluate {
    def mainClassesDir = file("${buildDir}/classes/java/main")
    def allClasses = fileTree(dir: mainClassesDir)
    def filtered = allClasses.matching { exclude jacocoExcluded }

    tasks.named('jacocoTestReport').configure {
        classDirectories.setFrom(files(filtered.files))
    }
    tasks.named('jacocoTestCoverageVerification').configure {
        classDirectories.setFrom(files(filtered.files))
    }
}

// ─── SpotBugs Static Analysis ───
spotbugs {
    effort = com.github.spotbugs.snom.Effort.DEFAULT
    reportLevel = com.github.spotbugs.snom.Confidence.valueOf('MEDIUM')
    excludeFilter = file('config/spotbugs/exclude.xml')
    // RECON-W38.4: pin the newest released SpotBugs engine. The previously
    // resolved engine could not read Java 25 bytecode ("Unsupported class
    // file major version 69"), so spotbugsMain exited 4 and wrote a 0-byte
    // report: the static-analysis gate produced NO evidence, and CI's
    // continue-on-error hid it.
    //
    // LIMITATION (verified 2026-10-26): 4.9.3 is the newest release on
    // Maven Central and still bundles ASM 9.7.1, which supports class file
    // major version 68 (Java 24) at most. This project targets Java 25
    // (major 69), so the analysis still cannot run. The pin keeps the tool
    // current so the gate recovers when a Java 25-capable release lands.
    // Until then CI must report this as an explicit, loud limitation rather
    // than a silent pass.
    toolVersion = '4.9.3'
}

spotbugsMain {
    reports {
        xml.required = true
        html.required = true
    }
}

// ─── JMH Benchmark Configuration ───
jmh {
    jmhVersion = '1.37'
    duplicateClassesStrategy = DuplicatesStrategy.EXCLUDE
    // Default benchmark: PerformanceBenchmark (all critical paths)
    // Override with: ./gradlew :matrix-core:jmh -PjmhBenchmark=NeuronBenchmark
    if (project.hasProperty('jmhBenchmark')) {
        includes = [project.jmhBenchmark]
    }
    // Result output format
    resultFormat = 'JSON'
    // Warmup and measurement defaults (overridden by annotations)
    warmupIterations = 5
    iterations = 10
    fork = 2
    // Profiling
    if (project.hasProperty('jmhProfiler')) {
        profilers = [project.jmhProfiler]
    }
}

// Custom task: run benchmarks and generate report
tasks.register('jmhReport', JavaExec) {
    dependsOn jmh
    group = 'benchmark'
    description = 'Run JMH benchmarks and generate performance report'
    classpath = sourceSets.jmh.runtimeClasspath
    mainClass = 'io.matrix.benchmark.PerformanceReport'
}

tasks.register('runMinecraftExperiment', JavaExec) {
    dependsOn jar
    group = 'application'
    description = 'Runs MinecraftExperiment sandbox'
    classpath = sourceSets.main.runtimeClasspath
    mainClass = 'io.matrix.MinecraftExperiment'
}

// ─── GraalVM Native Image ───
