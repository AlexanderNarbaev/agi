// Native build via Mandrel container (RUN 389: workingDir fix, RUN 390: image bump)
tasks.register('buildNativeContainer', Exec) {
    group = 'native'
    description = 'Build GraalVM native image via Quarkus + Mandrel container'
    workingDir = rootDir
    commandLine './gradlew', ':matrix-core:quarkusBuild',
            '-Dquarkus.native.enabled=true',
            '-Dquarkus.package.type=native',
            '-Dquarkus.native.container-build=true',
            '-Dquarkus.native.builder-image=quay.io/quarkus/ubi-quarkus-mandrel-builder-image:jdk-25',
            '--no-daemon'
}

// Local native build (requires GraalVM/Mandrel installed locally)
tasks.register('buildNativeLocal', Exec) {
    group = 'native'
    description = 'Build GraalVM native image locally (requires GraalVM/Mandrel)'
    workingDir = rootDir
    commandLine './gradlew', ':matrix-core:quarkusBuild',
            '-Dquarkus.native.enabled=true',
            '-Dquarkus.package.type=native',
            '--no-daemon'
}

// Run native binary
tasks.register('runNative', Exec) {
    dependsOn 'buildNative'
    group = 'native'
    description = 'Run the native binary'
    workingDir = rootDir
    commandLine "${project.layout.buildDirectory.get()}/matrix-core-${project.version}-runner"
}

// nativeTest is provided by GraalVM plugin as NativeRunTask

// ─── W48: the native-binary test scope ───────────────────────────────────────
//
// The native-binary tests launch build/native/nativeCompile/matrix-core. On a
// host without a native build they failed with
// "Cannot run program build/native/nativeCompile/matrix-core" — 23 failures
// that said nothing about the code under test and made the default JVM task
// untrustworthy.
//
// The scope is now separated into three, and none of them is silently dropped:
//
//   1. the default `test` task   — ordinary JVM tests; the native-binary and
//                                  native-build-configuration scopes are excluded;
//   2. `nativeBinaryTest`        — the tests that need the compiled executable;
//                                  it REFUSES to run with a clear message when
//                                  the executable is absent;
//   3. `nativeBuildConfigTest`   — the tests that validate the native BUILD
//                                  configuration (the Dockerfile) and need no
//                                  executable, so they run on any host.
//
// The exclusion is reported in docs-v2/engineering/TEST-CATALOGUE.yml and in
// docs-v2/engineering/W48-TEST-RECONCILIATION.md, and the native capability
// stays BLOCKED in CAPABILITY-REGISTRY.yml until an executable exists.
tasks.named('test') {
    useJUnitPlatform {
        excludeTags 'native-binary', 'native-build-config'
    }
}

tasks.register('nativeBinaryTest', Test) {
    group = 'native'
    description = 'Run the native-binary test scope (requires a compiled native executable)'
    testClassesDirs = sourceSets.test.output.classesDirs
    classpath = sourceSets.test.runtimeClasspath
    useJUnitPlatform {
        includeTags 'native-binary'
    }
    def nativeBinary = file("${project.layout.buildDirectory.get()}/native/nativeCompile/matrix-core")
    doFirst {
        if (!nativeBinary.exists()) {
            throw new GradleException(
                "The native executable ${nativeBinary} does not exist, so the native-binary " +
                "test scope cannot run. Build it with ./gradlew :matrix-core:buildNative " +
                "(GraalVM 25+ or Mandrel 24.x) and run this task again. This scope is " +
                "BLOCKED - it is not a pass, and the default JVM task does not cover it.")
        }
    }
}

tasks.register('nativeBuildConfigTest', Test) {
    group = 'native'
    description = 'Run the native build-configuration test scope (no executable required)'
    testClassesDirs = sourceSets.test.output.classesDirs
    classpath = sourceSets.test.runtimeClasspath
    useJUnitPlatform {
        includeTags 'native-build-config'
    }
}

tasks.register('nativeReflectionTest', Test) {
    group = 'native'
    description = 'Run native image reflection tests (JVM mode)'
    useJUnitPlatform {
        includeTags 'native-image'
    }
    include 'io/matrix/nativeimage/**'
}

// Native image smoke test (requires native binary)
tasks.register('nativeSmokeTest', Test) {
    group = 'native'
    description = 'Run native image smoke tests'
    dependsOn 'buildNative'
    useJUnitPlatform {
        includeTags 'native'
    }
    include 'io/matrix/NativeSmokeTest*'
    // Disable JVM tests — these run against the native binary
    enabled = false
}

// Native image compilation test (JVM mode, validates config)
tasks.register('nativeCompilationTest', Test) {
    group = 'native'
    description = 'Run native image compilation validation tests (JVM mode)'
    useJUnitPlatform {
        includeTags 'native-compilation'
    }
    include 'io/matrix/nativeimage/**'
}


// Dedicated coverage test task that bypasses Quarkus native-image agent filter
tasks.register('coverageTest', Test) {
    group = 'verification'
    description = 'Runs tests with JaCoCo agent for coverage measurement'
    useJUnitPlatform()
    if (!project.hasProperty('includeIntegration')) {
        exclude '**/integration/**'
    }
    jvmArgs '--add-modules=jdk.incubator.vector'
    jacoco {
        enabled = true
        includes = ['io.matrix.*']
    }
    // Force execution even if test task is up-to-date
    outputs.upToDateWhen { false }
}

// Enable zip64 for JMH jar
tasks.named("jmhJar") { zip64 = true }

// W51 — the end-to-end demonstration of the cognitive system.
//
// The one documented local path of the wave: it opens the canonical store, runs one
// cognitive cycle, learns in an environment, survives a restart, creates and validates a
// plugin, and accepts a message over the bridge — then writes the machine-readable trace
// that connects them.
//
//   ./gradlew :matrix-core:w51Demonstration
//
// The arguments are the data directory and the report path; both have defaults.
tasks.register('w51Demonstration', JavaExec) {
    group = 'verification'
    description = 'Runs the W51 end-to-end demonstration and writes its machine-readable trace'
    classpath = sourceSets.main.runtimeClasspath
    mainClass = 'io.matrix.w51.W51Demonstration'
    // The demonstration's paths are relative to the REPOSITORY root: the report belongs
    // to docs-v2/engineering and the data directory to the repository's own data/.
    workingDir = rootProject.projectDir
    args = [
        project.findProperty('w51.data') ?: 'data/w51',
        project.findProperty('w51.report') ?: 'docs-v2/engineering/W51-DEMONSTRATION.json'
    ]
    jvmArgs '--add-modules=jdk.incubator.vector'
}
