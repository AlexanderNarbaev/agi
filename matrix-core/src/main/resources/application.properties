# ─── Logging: plain text console + file for Loki ───
quarkus.log.console.json=false
quarkus.log.console.format=%d{HH:mm:ss} %-5p [%c{2.}] (%t) %s%e%n
quarkus.log.console.level=INFO
quarkus.log.file.enable=true
quarkus.log.file.path=logs/matrix.log
quarkus.log.file.format=%d{HH:mm:ss} %-5p [%c{2.}] (%t) %s%e%n
quarkus.log.file.level=INFO
quarkus.log.file.rotation.max-file-size=10M
quarkus.log.file.rotation.max-backup-index=3
quarkus.log.level=INFO

# ─── Redis ───
redis.uri=${REDIS_URI:redis://localhost:6379}

# ─── OpenTelemetry ───
quarkus.otel.enabled=true
quarkus.otel.exporter.otlp.endpoint=${OTEL_EXPORTER_ENDPOINT:http://localhost:4317}
quarkus.otel.service.name=matrix
quarkus.otel.traces.sampler=always_on

# ─── Micrometer / Prometheus ───
quarkus.micrometer.enabled=true
quarkus.micrometer.export.prometheus.enabled=true
quarkus.micrometer.export.prometheus.path=/metrics

# ─── Health ───
quarkus.smallrye-health.root-path=/q/health

# ─── HTTP ───
quarkus.http.port=${QUARKUS_HTTP_PORT:9091}

# ─── Database (PostgreSQL R2DBC) ───
quarkus.datasource.db-kind=postgresql
quarkus.datasource.username=${DB_USER:matrix}
quarkus.datasource.password=${DB_PASS:matrix}
quarkus.datasource.reactive.url=postgresql://${DB_HOST:localhost}:${DB_PORT:5433}/matrix

%dev.quarkus.datasource.devservices.enabled=false
%test.quarkus.datasource.devservices.enabled=false

# ─── Native (GraalVM 25 + Quarkus 3.37.3) ───
# RUN 18: extend --initialize-at-build-time list. The reactive PG / Scala
# extensions expose synthetic bean classes whose class-init chain crosses
# image-build vs run-time boundaries; we mark them all as build-time.
quarkus.native.additional-build-args=\
  -H:+ReportExceptionStackTraces,\
  -H:ReflectionConfigurationResources=META-INF/native-image/reflect-config.json,\
  -H:ResourceConfigurationResources=META-INF/native-image/resource-config.json,\
  -H:JNIConfigurationResources=META-INF/native-image/jni-config.json,\
  -H:DynamicProxyConfigurationResources=META-INF/native-image/proxy-config.json,\
  --enable-url-protocols=http,https,\
  -H:+AddAllCharsets,\
  -J-Xmx8g,\
  --initialize-at-build-time=io.vertx.mutiny.pgclient.PgPool_d1X4BXWWOXCUVicCEg66CwLl6pA_Synthetic_Bean,\
  --initialize-at-build-time=io.vertx.mutiny.pgclient.PgPool_Observer_Synthetic_53kOBafTmDZHb2yMOYL2juXI4SI,\
  --initialize-at-build-time=io.vertx.mutiny.sqlclient,\
  --initialize-at-build-time=io.vertx.pgclient,\
  --initialize-at-build-time=io.vertx.sqlclient,\
  --initialize-at-build-time=io.quarkus.bootstrap.logging.InitialConfigurator,\
  --initialize-at-build-time=io.quarkus.bootstrap.logging.QuarkusDelayedHandler,\
  --initialize-at-build-time=reactor.core.publisher.MonoDefer,\
  --initialize-at-build-time=org.wildfly.common.lock.ExtendedReentrantLock,\
  --initialize-at-build-time=com.fasterxml.jackson.module.scala.deser.EitherDeserializer,\
  --initialize-at-build-time=com.fasterxml.jackson.module.scala.deser.EitherDeserializer$ElementDeserializerConfig,\
  --initialize-at-build-time=org.tukaani.xz,\
  --initialize-at-build-time=io.netty.resolver.dns,\
  --initialize-at-build-time=io.netty.resolver,\
  --initialize-at-build-time=io.netty.handler.codec.dns,\
  --initialize-at-run-time=org.tukaani.xz.XZInputStream

# RUN 18: exclude reactive PG extensions from the native image. They are
# not used in the chat / chain / lm-head paths; the reactive postgres
# driver is the source of the cascading class-init whack-a-mole.
quarkus.native.exclude-config-jar-with-unused-classes=true

quarkus.native.resources.includes=**
quarkus.native.enabled=false

# ─── BIR (SPEC-002) ───
# Max literals (input/output bits) per BIR form and FPGA backend (INV-2).
# Read by io.matrix.bir.BirLimits via system property / MATRIX_BIR_MAX_LITERALS env.
matrix.bir.max-literals=${MATRIX_BIR_MAX_LITERALS:4096}

%test.quarkus.http.port=9092
%test.quarkus.log.level=WARN
