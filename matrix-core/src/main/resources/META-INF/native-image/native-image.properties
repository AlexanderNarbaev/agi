# MATRIX Core Native Image Properties — v2.2.0
# For GraalVM 25+ native-image builds
# RUN 391: removed --initialize-at-build-time=io.netty (Netty bundled
# metadata handles DNS init; our broader override was conflicting).
# RUN 392: Netty DNS error gone; new error is Random in image heap.
# Added --initialize-at-run-time=java.util.Random,
# java.util.SplittableRandom, java.util.concurrent.ThreadLocalRandom.
# CONSTITUTION I: any Random usage at build time should be at RUN time
# (build-time Random has deterministic seed → breaks determinism).
Args = -H:+ReportExceptionStackTraces \
       --enable-url-protocols=http,https \
       -H:ReflectionConfigurationResources=${.}/reflect-config.json \
       -H:ResourceConfigurationResources=${.}/resource-config.json \
       -H:JNIConfigurationResources=${.}/jni-config.json \
       -H:+AddAllCharsets \
       --initialize-at-build-time=org.jboss.logmanager \
       --initialize-at-build-time=org.slf4j \
       --initialize-at-build-time=com.fasterxml \
       --initialize-at-build-time=io.smallrye \
       --initialize-at-build-time=org.apache.avro \
       --initialize-at-run-time=io.matrix.cluster.NeuronClusterActor \
       --initialize-at-run-time=org.apache.pekko \
       --initialize-at-run-time=io.matrix.events.R2dbcEventJournal \
       --initialize-at-run-time=io.vertx.mutiny \
       --initialize-at-build-time=java.util.Random \
       --initialize-at-build-time=java.util.SplittableRandom \
       --initialize-at-build-time=java.util.concurrent.ThreadLocalRandom \
       --initialize-at-run-time=io.lettuce.core.resource.DefaultClientResources \
       --initialize-at-run-time=io.lettuce.core.resource.AddressResolverGroupProvider \
       --initialize-at-run-time=io.lettuce \
       --initialize-at-run-time=org.tukaani.xz \
       --initialize-at-run-time=org.apache.commons.compress.compressors.xz \
       --initialize-at-run-time=io.matrix.SystemDemo
