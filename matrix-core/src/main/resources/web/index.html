<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>MATRIX Conversation</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { 
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', monospace;
    background: #0a0a0a; color: #00ff88; line-height: 1.5;
    max-width: 800px; margin: 0 auto; padding: 20px;
}
h1 { color: #00ffff; border-bottom: 1px solid #003322; padding-bottom: 10px; }
.session-input { 
    display: flex; gap: 10px; margin: 20px 0; 
}
.session-input input { 
    flex: 1; padding: 10px; background: #1a1a1a; color: #00ff88;
    border: 1px solid #003322; font-family: monospace;
}
.session-input button { 
    padding: 10px 20px; background: #003322; color: #00ff88;
    border: 1px solid #00ff88; cursor: pointer; font-family: monospace;
}
.session-input button:hover { background: #004433; }
.chat { 
    margin-top: 20px; min-height: 200px;
    border: 1px solid #003322; padding: 10px; background: #050505;
}
.message { 
    margin: 10px 0; padding: 10px; border-left: 3px solid;
}
.user { 
    background: #0a1a0a; border-left-color: #00aaff; 
}
.assistant { 
    background: #001a0a; border-left-color: #00ff88; 
}
.role { 
    font-weight: bold; color: #ffff00; margin-bottom: 5px;
}
.input { 
    display: flex; gap: 10px; margin-top: 20px; 
}
.input textarea { 
    flex: 1; min-height: 60px; padding: 10px; background: #1a1a1a;
    color: #00ff88; border: 1px solid #003322; font-family: monospace;
    resize: vertical;
}
.input button { 
    padding: 10px 20px; background: #00ff88; color: #000;
    border: none; cursor: pointer; font-weight: bold;
}
.input button:hover { background: #00cc66; }
.input button:disabled { 
    background: #444; color: #888; cursor: not-allowed;
}
.status { 
    color: #888; font-size: 0.9em; margin: 10px 0;
}
.empty { 
    color: #555; font-style: italic; text-align: center; margin: 30px 0;
}
</style>
</head>
<body>
<h1>► MATRIX CONVERSATION ◄</h1>
<p>Local Qwen2.5-0.5B ONNX inference · Session continuity · NDJSON persistence</p>

<div class="session-input">
    <input id="sessionInput" placeholder="session-id (leave empty for new)" />
    <button onclick="loadSession()">Load</button>
    <button onclick="newSession()">New</button>
    <button onclick="listSessions()">List</button>
</div>

<div class="status" id="status">Ready</div>

<div class="chat" id="chat"></div>

<div class="input">
    <textarea id="messageInput" placeholder="Type your message..."></textarea>
    <button id="sendButton" onclick="sendMessage()">SEND</button>
</div>

<script>
let sessionId = localStorage.getItem('matrixSession') || '';
let isLoading = false;

document.getElementById('sessionInput').value = sessionId;
if (sessionId) {
    loadSession();
}

function updateStatus(msg) {
    document.getElementById('status').textContent = msg;
}

function escapeHtml(s) {
    return s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
}

function addMessage(role, content) {
    const chat = document.getElementById('chat');
    if (chat.querySelector('.empty')) chat.innerHTML = '';
    const div = document.createElement('div');
    div.className = 'message ' + role;
    div.innerHTML = '<div class="role">' + role.toUpperCase() + '</div><div>' + escapeHtml(content) + '</div>';
    chat.appendChild(div);
    div.scrollIntoView({ behavior: 'smooth' });
}

function clearChat() {
    document.getElementById('chat').innerHTML = '<p class="empty">No messages yet. Start the conversation!</p>';
}

async function loadSession() {
    sessionId = document.getElementById('sessionInput').value.trim();
    if (!sessionId) {
        updateStatus('Enter a session ID');
        return;
    }
    localStorage.setItem('matrixSession', sessionId);
    clearChat();
    updateStatus('Loading session: ' + sessionId + '...');
    
    try {
        const response = await fetch('/history?sessionId=' + encodeURIComponent(sessionId) + '&limit=50');
        if (response.status === 404) {
            updateStatus('Session not found: ' + sessionId + ' (new session)');
            return;
        }
        const data = await response.json();
        const turns = data.turns || [];
        if (turns.length === 0) {
            updateStatus('Session loaded (empty): ' + sessionId);
            return;
        }
        turns.forEach(turn => {
            try {
                const parsed = JSON.parse(turn);
                addMessage(parsed.role || '?', parsed.content || '');
            } catch (e) {
                // ignore parse errors
            }
        });
        updateStatus('Loaded ' + turns.length + ' turns from: ' + sessionId);
    } catch (e) {
        updateStatus('Error: ' + e.message);
    }
}

function newSession() {
    sessionId = '';
    document.getElementById('sessionInput').value = '';
    localStorage.removeItem('matrixSession');
    clearChat();
    updateStatus('New session. Type your first message.');
}

async function listSessions() {
    try {
        const response = await fetch('/sessions');
        const data = await response.json();
        const sessions = data.sessions || [];
        if (sessions.length === 0) {
            updateStatus('No sessions found');
        } else {
            const list = sessions.slice(0, 10).join(', ');
            updateStatus('Recent: ' + list);
        }
    } catch (e) {
        updateStatus('Error: ' + e.message);
    }
}

async function sendMessage() {
    if (isLoading) return;
    const msgEl = document.getElementById('messageInput');
    const msg = msgEl.value.trim();
    if (!msg) return;
    
    if (!sessionId) {
        sessionId = 'web-' + Date.now();
        document.getElementById('sessionInput').value = sessionId;
        localStorage.setItem('matrixSession', sessionId);
        clearChat();
    }
    
    isLoading = true;
    const sendBtn = document.getElementById('sendButton');
    sendBtn.disabled = true;
    
    addMessage('user', msg);
    msgEl.value = '';
    updateStatus('Thinking...');
    
    try {
        const response = await fetch('/chat', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ message: msg, sessionId: sessionId })
        });
        const data = await response.json();
        addMessage('assistant', data.reply || '[empty]');
        updateStatus('OK · ' + (data.priorTurns || 0) + ' prior turns');
    } catch (e) {
        updateStatus('Error: ' + e.message);
    } finally {
        isLoading = false;
        sendBtn.disabled = false;
    }
}

// Enter to send
document.getElementById('messageInput').addEventListener('keydown', (e) => {
    if (e.key === 'Enter' && !e.ctrlKey && !e.shiftKey) {
        e.preventDefault();
        sendMessage();
    }
});
</script>
</body>
</html>
