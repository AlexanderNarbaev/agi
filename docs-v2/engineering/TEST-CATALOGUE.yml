      the true W44 split is 8 native-image classes / 23 failures PLUS 1 ordinary JVM
      failure (io.matrix.consciousness.Exp228ComplianceTest, random=63, wallClock=47).
      The W44 hypothesis map, which attributes all 24 failures to native-image, is wrong
      on that one and is corrected in the W45 test-evidence reconciliation. The W48
