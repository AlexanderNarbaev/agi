      that fifteen mutations of the milestone's evidence are each caught by the check they
      belong to, on a COPY in a temporary directory - the repository is never written to
      and the copy's manifest is refreshed FIRST, so that no mutation can be caught by the
      manifest alone:
      a removed row (caught by "every evaluation case of every domain is measured in
      every arm of every condition"), a relabelled false admission (caught by "every
      false admission and every false rejection is re-derived from the row it belongs
      to"), a changed denominator (caught by "the summary's counts are re-derived from
      the rows, with the two denominators separate"), a refusal that loses its reason
      (caught by "every refusal names its reason as a field of its own"), a changed
      corpus digest in the case set (caught by "the case set's corpus digests match the
      corpus bytes"), a RED that stops failing (caught by "the RED carries failures"), a
      mislabelled row kind (caught by "every row names the case of the case set it
      measures, with that case's own kind and answerability"), a forged scope (caught by
      "every arm's scope is the scope the summary records, and its validation outcome is
      consistent with its own agreement"), a falsified validation outcome (caught by the
      same check), a falsified breakdown by the kind of the case (caught by "the breakdown
      by the kind of the case is re-derived from the rows") and an arm measured against
      another input (caught by "the six arms of every cell were measured against ONE
      input").
    what_it_does_not_prove: >-
      it does not prove that the gate catches a mutation that leaves every check's
      precondition intact: it proves that the gate REFUSES fifteen specific classes of
      broken evidence, not that it refuses every possible one.
    destructive_side_effects: none - it works on a copy in a temporary directory and
      removes only its own temporary directory
    environment_dependencies:
      - python3
    next_verification_condition: any change to the gate itself or to the self-test

