    destructive_side_effects: none
    next_verification_condition: any change to the gate itself

  - id: INTEGRATION-SIGKILL-JOURNEY
    purpose: prove that a request survives the death of its process - the crash-consistency
      claim of W45.1
    task: 'bash scripts/w45-cognitive-recovery-journey.sh'
    filters: []
    evidence: 'the script''s own printed counts and its exit code'
    last_verified_commit: a6ded23338e069b8bc8a3744c234be5a03995f43
    last_execution: '2026-11-04'
    result:
      checks: 37
      failed: 0
      exit_code: 0
    what_it_proves: >-
      three real SIGKILLs - confirmed by the exit status 137 = 128+9 - at the failpoints
      CLAIMED, OBSERVATION_COMMITTED and IDEMPOTENCY_COMPLETED; the retry is re-executable
      where nothing durable was written, INDETERMINATE where a durable effect exists, and a
      replay where the outcome was already persisted.
    what_it_does_not_prove: >-
      the epistemic restoration is proved at the store-reopen level, not across a SIGKILL.
    destructive_side_effects: none - it creates its own temporary database and removes it
    environment_dependencies:
