      GraalVM and Mandrel are absent on this host, the mandrel builder image is not in
      the local docker, and matrix-core/build/native has never existed here.
    status: NOT_EXECUTED - never counted as passing; since W48 the scope is named, and it
      refuses to run rather than failing
    owner_decision_required: false
