# MATRIX — TEST CATALOGUE
#
# Status: CANONICAL
# Date: 2026-11-04
#
# The registry of every verification scope the repository actually runs, with the exact
# filter, the exact result, and the commit the result belongs to.
#
# THE RULES
#   1. A BASELINE IS COMMIT-SPECIFIC. A stale count is not a baseline.
#   2. THE JUNIT XML IS THE EVIDENCE, not the Gradle console summary. The XML lives in
#      <module>/build/test-results/test/*.xml.
#   3. THE COUNTS BELOW ARE SEPARATE AXES. Discovered, executed, successful, failed,
#      errored, skipped, filtered and not-executed are different things.
#   4. A SCOPE THAT CANNOT RUN IN THIS ENVIRONMENT IS NOT COUNTED AS PASSING. The
#      native-image scopes are in this category: GraalVM is absent on this host.
#   5. THE FULL matrix-core SUITE IS NOT IN THIS CATALOGUE. It needs the owner's approval
#      and a resource estimate; the targeted scopes are the project's normal verification.

