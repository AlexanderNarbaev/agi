  - id: GATE-CHAIN-ISOLATION
    purpose: prove that the two serving chains do not meet - no chain B class reaches the
      cognitive store, the epistemic store or the chain A surface
    task: 'bash scripts/w45-chain-isolation-check.sh'
    filters: []
    evidence: 'the script''s own printed counts and its exit code'
    last_verified_commit: a6ded23338e069b8bc8a3744c234be5a03995f43
    last_execution: '2026-11-04'
    result:
      checks: 16
      failed: 0
      exit_code: 0
    what_it_proves: >-
      over 2909 classes and 76858 constant-pool edges, no class reachable from the four
      chain B entry points reaches io.matrix.cognitive.**, the epistemic store's own
      classes, the classes that name the epistemic database, or the chain A serving
      surface; and at runtime the real chain B server answers 404 for three chain A
      routes and leaves the owner's epistemic database byte-identical.
    what_it_does_not_prove: >-
      the proof is static - the constant pool does not resolve reflection, JNI or a native
      image built from another class set; and the runtime part probes three
      representative chain A routes rather than fuzzing the whole surface.
    destructive_side_effects: none - it works on a private copy of the class files and
      removes only its own temporary directory
    environment_dependencies:
      - the JDK 25 at /home/alexandr-narbaev/jdk25
      - the compiled classes of the four modules
    next_verification_condition: any change to the serving topology of either chain

