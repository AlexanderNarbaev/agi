evidence_model:
  primary: the JUnit XML under <module>/build/test-results/test/*.xml
  secondary: the gate exit codes and the gate's own printed counts
  forbidden:
    - inferring the counts from the Gradle console summary alone when the XML exists
    - reporting a scope as green when it was not executed
    - carrying a count forward to a commit it was not measured on

