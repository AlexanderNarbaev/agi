    notes: "ADDED IN W51. The rule that a crossing is a class reachable from chain B AND from chain A's own store is the one the gate uses — not chain A's whole closure, because the shared substrate is not a path to the store."

  -
    id: "W52-METHOD-PROFILE"
    name: "the profile of the system's own methods: what each method costs, and how it has behaved"
    description: "The durable record of what the system's methods actually do. Before W52 the ledger of measured costs lived in the heap: every restart threw it away, and the method-selection layer — which the mandate asks to weigh the historical measured performance of a method against — fell back to the DECLARED complexity of each method, which is a person's estimate in the place where a measurement belonged. The profile is now a table of the cognitive database (cognitive_method_measurement): the total nanoseconds, the calls, the successes and the failures, per method and per workspace, written by the single writer of that database. A ledger built on a reopened store reads the profile back at construction, so a process that starts knows what its own methods cost before it has run any of them, and the selector's decision names the measurement AND its outcomes."
    domain: "learning"
    implementation: "IMPLEMENTED"
    integration: "INTEGRATED"
    verification: "INTEGRATION_TESTED"
    operational: "SERVED"
    serving_chain: "chain-a"
    serving_path: "the ledger is built by the runtime that serves the cognitive surface — io.matrix.cognitive.CognitiveService.build() — and read by the selector of every cycle: POST /v1/cognitive/observe and POST /v1/cognitive/solve on chain A (io.matrix.cognitive.CognitiveResource). The profile is not a route of its own; it is the memory the selection reads."
    source_paths:
