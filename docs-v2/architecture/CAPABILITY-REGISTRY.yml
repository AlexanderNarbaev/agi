    limitations: "the snapshot is a logical export, not a file-level backup; no whole-database backup exists. There is no HTTP endpoint for reading a snapshot back. The bound applies to the snapshot PAYLOAD only — not to the database file, not to the learning tables outside a snapshot. The retention calendar is applied per workspace and by hand: nothing puts the pass on a timer. The application property route is not wired; the bound is read once, when the store is opened, from the system property matrix.knowledge.snapshot.max-payload-bytes, and a non-numeric or non-positive value is refused at start-up."
