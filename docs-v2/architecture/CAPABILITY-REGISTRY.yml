  -
    id: "W51-CANONICAL-CONTRACTS"
    name: "the canonical cognitive contracts: 23 records and the bridge envelopes in the neutral package io.matrix.contract"
    description: "The twenty-two types the mandate names — Entity, Relation, Property, WorldState, StateTransition, Event, Observation, Evidence, Belief, Hypothesis, Prediction, Experiment, Action, Outcome, Goal, Task, Skill, Procedure, Algorithm, Plugin, Evaluation, Reflection — plus Confidence, Provenance, BeliefStatus, ValidityInterval, Correlation, Capability, the command/response envelopes and the RetryPolicy. Each record carries a stable identity, a version, a provenance, a confidence where the type admits one, and the belief-status vocabulary that separates an OBSERVED fact from an ASSERTED source claim, a CANDIDATE, a SUPPORTED, a CONTESTED, a REFUTED, an UNRESOLVED and a SUPERSEDED proposition. The package is neutral: it owns no chain, opens no database and serves no route, which is what lets the isolation gate keep its rules G1 to G6 unchanged and add G7."
    domain: "contracts"
    implementation: "IMPLEMENTED"
    integration: "INTEGRATED"
    verification: "TESTED"
    operational: "SERVED"
    serving_chain: "both"
    serving_path: "the contracts are carried by the routes that use them: POST /v1/bridge/messages on chain A (io.matrix.bridge.BridgeResource) and POST /v1/cognitive/observe and POST /v1/cognitive/solve on chain A (io.matrix.cognitive.CognitiveResource), and by the chain B publisher that speaks the same protocol (io.matrix.brain.runtime.bridge.BridgePublisher). W52 adds the second direction of the bridge: POST /v1/bridge/knowledge on chain B (io.matrix.api.bridge.KnowledgeBridge) carries the canonical Belief and the canonical Outcome back. They are not a route of their own: they are the vocabulary those routes carry."
    source_paths:
      - "matrix-core/src/main/java/io/matrix/contract/Belief.java"
      - "matrix-core/src/main/java/io/matrix/contract/BeliefStatus.java"
      - "matrix-core/src/main/java/io/matrix/contract/Confidence.java"
      - "matrix-core/src/main/java/io/matrix/contract/Provenance.java"
      - "matrix-core/src/main/java/io/matrix/contract/ValidityInterval.java"
      - "matrix-core/src/main/java/io/matrix/contract/Correlation.java"
      - "matrix-core/src/main/java/io/matrix/contract/bridge/BridgeEnvelope.java"
      - "matrix-core/src/main/java/io/matrix/contract/bridge/BridgeProtocol.java"
    production_callers:
      - "io.matrix.cognitive.reflection.CycleReflection — matrix-core/src/main/java/io/matrix/cognitive/reflection/CycleReflection.java"
      - "io.matrix.cognitive.worldstate.WorldStateMemory — matrix-core/src/main/java/io/matrix/cognitive/worldstate/WorldStateMemory.java"
      - "io.matrix.cognitive.worldstate.StateFact — matrix-core/src/main/java/io/matrix/cognitive/worldstate/StateFact.java"
      - "io.matrix.bridge.EpistemicBridgeSink — matrix-core/src/main/java/io/matrix/bridge/EpistemicBridgeSink.java"
      - "io.matrix.brain.runtime.bridge.BridgePublisher — matrix-brain-runtime/src/main/java/io/matrix/brain/runtime/bridge/BridgePublisher.java"
    test_paths:
      - "matrix-core/src/test/java/io/matrix/contract/CanonicalContractsTest.java"
    test_evidence: "the contract scope: 33 tests in CanonicalContractsTest, 0 failures. The bridge protocol's own scope adds 63 tests. W52 adds the ACCEPTANCE of the canonical form: CanonicalContractCoverageTest drives the real kernel and asserts that every contract the mandate names has a producer, and CanonicalCycleBuilderTest (9 tests) pins the mapping's rules — an absent fact becomes an absent record, a hypothesis with no support is UNRESOLVED, a hypothesis with contradictions is CONTESTED, and a procedure that was not validated is not marked reusable. The evidence is the JUnit XML at matrix-core/build/test-results/test/TEST-io.matrix.contract*.xml; the wave's whole scope was 1352 tests, 0 failures, 0 errors."
    benchmark_evidence: "none — a contract has no throughput to measure; what is measured about it is that the gate can prove the package is pure (G7: nineteen contract classes are reachable from chain B and none of them can open a database, serve a route or reach a store)."
    formal_spec: "none"
    dependencies:
      - "the JDK 25 — records, sealed types and pattern matching"
      - "no dependency of its own: the package is pure"
    limitations: "the contracts are the INTERCHANGE form, and the runtime still keeps an older, internal vocabulary of its own — io.matrix.cognitive.Prediction, Goal, Task, Procedure, Experiment and Hypothesis — which is what the store's schema and the W45.1 recovery contracts are written against. W52 gave every contract of the mandate a producer: the cognitive cycle now produces the canonical form of itself (io.matrix.contract.CognitiveCycle), and the acceptance — CanonicalContractCoverageTest — asserts it for all twenty-two. TWO of them cannot be produced by the micro-world's own run: the Procedure and the Skill come from the procedural memory, and the lamp world's input domain is exhausted once the model settles, so the promotion is refused there by the W45 finding. The demonstration's report names them as absent rather than faking them. Merging the two vocabularies into one is a refactor of a working, durable path and was deliberately not attempted; what W52 did instead is name the boundary between them — one mapping, tested."
    risks:
      - "a contract that nothing fills is a shape without a meaning: the interchange-only records can drift from the runtime's own semantics without any test noticing"
      - "the two vocabularies invite a second implementation of the same responsibility, which the mandate forbids"
