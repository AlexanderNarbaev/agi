# =============================================================================
# CAPABILITY REGISTRY — MATRIX
# =============================================================================
#
# WHAT THIS FILE IS
#   The single authoritative, machine-readable registry of MATRIX's capabilities.
#   Every row states FOUR independent facts, on FOUR independent axes, and never
#   one green checkmark:
#
#     implementation  does the source exist?
#     integration     is it wired into a production path?
#     verification    what has been executed, and what does the execution prove?
#     operational     what is it doing in production right now?
#
#   The four axes are deliberately separable. A subsystem can be IMPLEMENTED and
#   DORMANT at the same time; a gate can be MEASURED and DORMANT at the same
#   time. Collapsing them is the error this file exists to prevent.
#
# WHAT THIS FILE REPLACES
#   docs-v2/architecture/CAPABILITY-REGISTRY.md      (dated 2026-10-26) — its
#       vocabulary is the PROVENANCE OF A CLAIM (VERIFIED / UNSOURCED / CORRECTED
#       / REWORDED / REMOVED), not the STATE of a capability, and it carries three
#       refuted or stale numbers: the test count, the TLA count and the speed-up
#       factor.
#   docs-v2/engineering/W44-CAPABILITY-REGISTRY.md  — a different vocabulary
#       entirely (IMPLEMENTED / TESTED / SERVED / ISLAND / INACTIVE / DORMANT / ...).
#
#   Both files REMAIN ON DISK as evidence. Neither is rewritten here; the
#   coordinator annotates them with a pointer to this one.
#
# THE THREE RULES
#   1. A capability may not be SERVED without a named serving path in
#      `serving_path` (an HTTP route, a CLI, a runtime wiring).
#   2. A capability may not be MEASURED without a reproducible benchmark in
#      `benchmark_evidence`.
#   3. A capability may not be FORMALLY_VERIFIED merely because a TLA+ file
#      exists — it needs the model-check evidence.
#
# HOW TO READ A ROW
#   - `id` is stable and unique. The `C-0x` ids are CLAIM PROVENANCE, not
#     capability identity: for those rows the `description` says so and carries
#     the claim's own wording.
#   - `implementation` / `integration` / `verification` / `operational` hold
#     exactly one value from the vocabulary declared in `status_vocabularies`.
#     A value that is not in the vocabulary is a defect in this file.
#   - `serving_chain` is one of: chain-a, chain-b, none, both.
#   - `source_paths`, `test_paths` and `production_callers` hold PATHS THAT
#     EXIST. A path may carry a line reference after a colon: `path/to/File.java:42`
#     or `path/to/File.java:42-57`. The validator strips that suffix before
#     checking existence. A path that does not exist is a finding, and is
#     recorded in `risks` or in `notes` — never silently written as a value.
#   - `production_callers` entries are written `ClassName — path/to/File.java`.
#   - `notes` carries the CSV's literal cell values that are not members of a
#     vocabulary, and every correction this wave made to a source path, a caller
#     count or a claim.
#   - `last_verified_commit` is the commit at which this row's claims were
#     checked against the tree; `last_verified_at` is the date of the EVIDENCE.
#     `next_verification_condition` says what would refresh the row.
#   - `none` means "there is no such thing", not "unknown". `unknown` is a
#     member of the vocabularies and means "not established".
#
# GENERATED
#   Reconciled from docs-v2/engineering/W46-CAPABILITY-RECONCILIATION.csv (27
#   rows) plus the capabilities the W46.0 audit found that the CSV does not
#   yet carry. Additions were made FROM THE SOURCE, never from a document's own
#   claim.
#
# =============================================================================

