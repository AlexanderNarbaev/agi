  -
    id: "W51-PLUGIN-SYSTEM"
    name: "the plugin architecture and the creator mode"
    description: "io.matrix.plugin — the manifest and identity, the versioning, the dependency and capability declarations, the service and event registration, the lifecycle PROPOSED to BUILDING to SANDBOXED to VALIDATED to SHADOW to ACTIVE with the failure, revocation and retirement states, the resource ownership and the cleanup, the health, the execution budget, the audit, the rollback and the revocation. The creator mode recognises a capability gap, proposes a plugin, builds its artefact, validates it against its declared cases and hands it to the runtime's policy. The isolation is a closed declarative interpreter whose vocabulary contains no operation that opens a file, a socket, a process or a class — a stronger boundary than a classloader, which is not a sandbox, and a weaker capability than WASM, which this environment cannot obtain."
