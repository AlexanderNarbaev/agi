  -
    id: "W51-CYCLE-REFLECTION"
    name: "the cycle's reflection: the evaluation of the actual decision, with machine-readable decisions"
    description: "io.matrix.cognitive.reflection — the REFLECT phase of the cognitive cycle. It names what was attempted, which method was selected and why, what was predicted, what happened, what differed, what was learned and what remains uncertain, and it produces DECISIONS that can be carried out: prefer a method, withdraw a method, leave a proposition unresolved. The rule is the outcome and it distinguishes three cases: a method whose prediction was CONTRADICTED is withdrawn; a method that answered and was confirmed is preferred; a method that could not answer is neither, because it did not fail — the model was unsettled — and what remains unresolved is the proposition."
