    test_evidence: "MethodProfileDurabilityTest — 5 tests: the measurement is written, the store is closed, the store is opened again, and the selector weighs the restored measurement and names it (\"measured 5000ns; 2 call(s), 1 success(es), 1 failure(es)\"); a method that was never measured stays unmeasured; the profile of one workspace does not leak into another; and the process-local ledger still works and says that it is process-local."
    benchmark_evidence: "the wave's own scope: 1352 tests, 0 failures, 0 errors. The measurement the profile records is the method's own duration, and the profile is what the selector's decision reads — the decision names the mean and the counts, so the measurement is visible in the artefact the system produces, not only in the heap."
    formal_spec: "none"
