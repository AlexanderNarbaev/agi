  -
    id: "W46-GPU"
    name: "the published claim: \"the GPU is used by MATRIX\""
    description: "An audited claim, not a capability identity. The claim was audited as FALSE as written, and that finding is the historical record and is kept: the ONNX Runtime GPU build is on the classpath and the CUDA provider is compiled in, but MATRIX's Java path requests the GPU inside a catch block and falls back to the CPU. The current state is measured. The CUDA provider DOES execute when LD_LIBRARY_PATH names a libcudart that exports cudaLibraryGetKernel, and the measured speed-up of the serving path is 12.06x — 12.06 / 11.68 / 11.47 over three independent runs; the historical digit 12.6x stays HISTORICAL and is BOUNDED, not replaced. The provider executing is NOT the claim that MATRIX always uses the GPU: the serving path still falls back to the CPU unless the loader path is set."
    domain: "hardware"
    implementation: "IMPLEMENTED"
    integration: "INTEGRATION_TESTED"
    verification: "MEASURED"
    operational: "SERVED"
    source_paths:
      - "matrix-core/src/main/java/io/matrix/api/OnnxRuntimeAdapter.java"
      - "scripts/start_production.sh"
      - "matrix-core/build.gradle:77"
      - "matrix-core/build.gradle:135-155"
      - "docs-v2/engineering/W46-HARDWARE-AND-RESOURCE-REPORT.md"
      - "models/onnx/qwen05b/model.onnx"
      - "scripts/gpu-benchmark.sh"
      - "docs-v2/engineering/W48-GPU-BENCHMARK.md"
      - "matrix-core/src/test/java/io/matrix/benchmark/GpuBenchmarkHarness.java"
    production_callers:
      - "io.matrix.api.OnnxRuntimeAdapter — matrix-core/src/main/java/io/matrix/api/OnnxRuntimeAdapter.java"
    serving_chain: "chain-a"
    serving_path: "POST /v1/chat/completions — QwenOnnxBridge — OnnxRuntimeAdapter. With the launcher's LD_LIBRARY_PATH the CUDA provider registers and the execution profile names it; without it the adapter records the fallback and its cause. The GPU is served CONDITIONALLY: the CPU provider serves the same route when the loader finds a libcudart that does not export cudaLibraryGetKernel."
    test_paths:
      - "matrix-core/src/test/java/io/matrix/api/OnnxRuntimeGpuTest.java"
      - "matrix-core/src/test/java/io/matrix/api/OnnxRuntimeAdapterTest.java"
      - "matrix-core/src/test/java/io/matrix/api/OnnxRuntimeGpuDiagnosticTest.java"
      - "matrix-core/src/test/java/io/matrix/benchmark/GpuBenchmarkHarnessTest.java"
    test_evidence: "29 executions, 0 failures, 0 errors: OnnxRuntimeGpuTest (7), OnnxRuntimeAdapterTest (9) and OnnxRuntimeGpuDiagnosticTest (13) — the W46 measurement. The decision table of the seven GPU states is exercised with no GPU, no model and no ONNX Runtime. Without LD_LIBRARY_PATH one test is SKIPPED with its reason in the JUnit XML; with LD_LIBRARY_PATH exported all 29 run and the execution profile names the CUDA provider. W48 added the harness's own arithmetic: GpuBenchmarkHarnessTest — 8 executions, 0 failures, 0 errors, measured on 2026-11-06 (matrix-core/build/test-results/test/TEST-io.matrix.benchmark.GpuBenchmarkHarnessTest.xml)."
    benchmark_evidence: "scripts/gpu-benchmark.sh (committed at 75937934) with the harness matrix-core/src/test/java/io/matrix/benchmark/GpuBenchmarkHarness.java — the reproducible measurement of the ONNX provider path; the report is docs-v2/engineering/W48-GPU-BENCHMARK.md. The device is an NVIDIA GeForce RTX 5070 Ti Laptop GPU with 12227 MiB of VRAM, driver 595.99.02, and the CUDA version the driver supports is 13.2. On models/onnx/qwen05b/model.onnx (graph sha256 5f59f2cd3eb36963746ca22411f83bde429e9dece9722389653882dfc4e0145d, external weights model.onnx_data sha256 72303ef1d77c02e4efc46a35b5cc60a841213518baa0ddae6247d44f1686265a), sequence length 32, 5 warm-ups and 20 timed iterations, with LD_LIBRARY_PATH exported for the CPU and the CUDA case alike so that the provider is the only variable: the MATRIX forward call is 160.995 ms on the CPU against 13.345 ms on the CUDA — 12.06x; the raw session.run is 173.846 ms against 7.325 ms — 23.73x; the end-to-end path is 2220.734 ms against 174.952 ms — 12.69x; the ONNX point call is 0.008 ms against 0.034 ms — 0.24x, so the GPU is 4x SLOWER on a single-point call; the BIR point call is 0.075 µs against 0.080 µs and has no GPU path at all. Three independent runs of the same protocol give 12.06x / 11.68x / 11.47x on the serving path. A FOURTH independent run of the same committed harness, measured in W49 on the same machine, gives 13.62x on the serving path (189.406 ms against 13.908 ms), 23.25x on the raw call, 11.17x end-to-end, 0.25x on the single-point ONNX call and 1.01x on the BIR point call: the qualitative picture does not change, and the ratio moves with the machine's state — the CPU median was 189.4 ms in that run against 161.0 ms in the run above. The published figures therefore carry four runs, not three, and the spread is the honest answer. The historical figure — 191.367 ms against 15.190 ms, 12.6x, from W46-HARDWARE-AND-RESOURCE-REPORT.md §6 — stays HISTORICAL and is BOUNDED by this measurement: every re-measurement lands 4.3-9.0% below it, and both of its absolute figures are 12-27% higher than today's. The benchmark REFUSES to publish a GPU number when the execution profile does not name CUDAExecutionProvider (exit 5) and reports NOT VERIFIED (exit 3) when the device, the CUDA libraries, the ONNX Runtime GPU jar or the model is missing; both paths were exercised on this machine."
    formal_spec: "none"
    dependencies:
      - "com.microsoft.onnxruntime:onnxruntime_gpu:1.29.0 (matrix-core/build.gradle:77)"
      - "the CUDA runtime the loader actually finds — LD_LIBRARY_PATH, not -Djava.library.path"
      - "the model graph and its external weights file — models/onnx/qwen05b/model.onnx and model.onnx_data, whose two digests the benchmark records"
    limitations: "ONNX Runtime 1.29.0 exposes no OrtSession.getProviders(), so the truth comes from getEpDevices(), getModelCompatibilityForEpDevices() and the execution profile — and getModelCompatibilityForEpDevices SEGFAULTS the JVM when a CUDA device is in the list, so it is not called. The CUDA provider does NOT take the whole graph: 1170 of the 2600 nodes still ran on the CPU in the measured session, so the figure is the figure of a partially offloaded graph. The adapter reports the CONFIGURED provider set until the execution profile is captured: activeProviders is assigned from cudaRegistered (OnnxRuntimeAdapter.java:526-528), and captureExecutionProviders() replaces it with the OBSERVED names read from the profile (OnnxRuntimeAdapter.java:284-311). The speed-up is TRUE for a transformer forward pass and FALSE for point calls. The GPU is served CONDITIONALLY: without LD_LIBRARY_PATH the loader finds the distro's libcudart.so.12, which exports cudaLibraryGetKernel zero times, addCUDA() throws, the catch records the cause and the session is created with the CPU provider only. The benchmark needs a five-entry explicit classpath, because a long command-line classpath SEGFAULTS the JVM on this machine (W48-GPU-BENCHMARK.md §8.1)."
    risks:
      - "LD_LIBRARY_PATH is consulted by the OS loader for EVERY native library the process loads, so a wrong library there can break unrelated native code. The launcher prepends only .onnx_libs, and only when the directory exists, so a fresh clone behaves exactly as before."
      - "the claim was published as true and the hardware report of the W620 wave recorded 'the GPU is unavailable to this machine' — both are loader-path facts, not hardware facts"
      - "no CI job exercises the GPU path: grep -niE \"gpu|cuda|nvidia\" .github/workflows/ci.yml returns no match, and .onnx_libs is gitignored, so the CUDA libraries the measurement needs are not in the repository. The measurement is reproducible on the owner's machine only."
    owner: "the owner (NO — the claim was false as written; whether the GPU belongs in the serving path is still the owner's open question Q-W46-07, and the measurement half of it is now answered)"
    decision_ref: "docs-v2/engineering/W46-CAPABILITY-RECONCILIATION.csv row W46-GPU; docs-v2/engineering/W46-HARDWARE-AND-RESOURCE-REPORT.md §6; docs-v2/engineering/W48-GPU-BENCHMARK.md; OD-043"
    last_verified_commit: "72a3f8e8"
    last_verified_at: "2026-11-06"
    next_verification_condition: "the benchmark runs again on a machine that has the CUDA libraries and the documented model digests — the graph sha256 5f59f2cd… and the external weights sha256 72303ef1… — with scripts/gpu-benchmark.sh, LD_LIBRARY_PATH exported for the CPU and the CUDA case alike, and three runs. The serving path still falls back to the CPU unless LD_LIBRARY_PATH is set, so the GPU is NOT unconditionally served: this row's own claim becomes true only when the launcher sets the loader path itself and the adapter reports the provider that actually ran. The owner must also decide whether the GPU is in scope for MATRIX at all (Q-W46-07)."
    notes: "W47 (OD-028) changed this row. The CSV's integration cell was 'NOT INTEGRATED (the registration fails)', which is not a member of this registry's integration vocabulary, and its operational cell was 'INACTIVE', which is not a member of the operational vocabulary: the axes now say what the wave measured — INTEGRATION_TESTED, TESTED and SERVED — and the CSV keeps its literal cells as the historical record. W48 (OD-043, commit 75937934) changed it again: the ad-hoc probe is replaced by a committed benchmark, the verification axis moves from TESTED to MEASURED, and the audit finding is KEPT as the historical record rather than deleted. ONE CORRECTION to the report this row cites: W48-GPU-BENCHMARK.md §8.2 calls the adapter's activeProviders a hardcoded string, but at that commit the assignment is conditional (OnnxRuntimeAdapter.java:526-528) and captureExecutionProviders() replaces it with the OBSERVED provider names (OnnxRuntimeAdapter.java:284-311) — this row therefore states the code as it is."

