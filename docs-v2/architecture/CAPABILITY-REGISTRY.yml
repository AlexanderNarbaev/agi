  -
    id: "W46-GPU"
    name: "the published claim: \"the GPU is used by MATRIX\""
    description: "An audited claim, not a capability identity. The claim is FALSE as written: the ONNX Runtime GPU build is on the classpath and the CUDA provider is compiled in, but MATRIX's Java path requests the GPU inside a catch block and silently falls back to the CPU."
    domain: "hardware"
    implementation: "IMPLEMENTED"
    integration: "UNKNOWN"
    verification: "REJECTED"
    operational: "DORMANT"
    source_paths:
      - "matrix-core/src/main/java/io/matrix/api/OnnxRuntimeAdapter.java:104-114"
      - "matrix-core/src/main/java/io/matrix/api/OnnxRuntimeAdapter.java:118-123"
      - "matrix-core/build.gradle:77"
      - "matrix-core/build.gradle:135-155"
      - "docs-v2/engineering/W46-HARDWARE-AND-RESOURCE-REPORT.md"
      - "models/onnx/qwen05b/model.onnx"
    production_callers:
      - "io.matrix.api.OnnxRuntimeAdapter — matrix-core/src/main/java/io/matrix/api/OnnxRuntimeAdapter.java"
    serving_chain: "chain-a"
    serving_path: "POST /v1/chat/completions — QwenOnnxBridge — OnnxRuntimeAdapter. With the launcher's LD_LIBRARY_PATH the CUDA provider registers and the execution profile names it; without it the adapter records the fallback and its cause"
    test_paths:
      - "matrix-core/src/test/java/io/matrix/api/OnnxRuntimeGpuTest.java"
      - "matrix-core/src/test/java/io/matrix/api/OnnxRuntimeAdapterTest.java"
      - "matrix-core/src/test/java/io/matrix/api/OnnxRuntimeGpuDiagnosticTest.java"
    test_evidence: "29 executions, 0 failures, 0 errors: OnnxRuntimeGpuTest (7), OnnxRuntimeAdapterTest (9) and OnnxRuntimeGpuDiagnosticTest (13). The decision table of the seven GPU states is exercised with no GPU, no model and no ONNX Runtime. Without LD_LIBRARY_PATH one test is SKIPPED with its reason in the JUnit XML; with LD_LIBRARY_PATH exported all 29 run and the execution profile names the CUDA provider."
    benchmark_evidence: "W46-HARDWARE-AND-RESOURCE-REPORT.md §6: with LD_LIBRARY_PATH exported the provider loads; without it the loader finds the distro's libcudart.so.12 (CUDA 12.4), which lacks cudaLibraryGetKernel. Measured on the same model (models/onnx/qwen05b/model.onnx, sequence length 32, 10 iterations after one warm-up): 191.367 ms per forward on the CPU against 15.190 ms on the CUDA (12.6×). The historical EXP-009C reproduces within 1.4% on the torch path. The measurement is reproducible by running scripts/bench_gpu_vs_bir.py and the ONNX probe with and without LD_LIBRARY_PATH."
    formal_spec: "none"
    dependencies:
      - "com.microsoft.onnxruntime:onnxruntime_gpu:1.29.0 (matrix-core/build.gradle:77)"
      - "the CUDA runtime the loader actually finds — LD_LIBRARY_PATH, not -Djava.library.path"
    limitations: "ONNX Runtime 1.29.0 exposes no OrtSession.getProviders(), so the truth comes from getEpDevices(), getModelCompatibilityForEpDevices() and the execution profile — and getModelCompatibilityForEpDevices SEGFAULTS the JVM when a CUDA device is in the list, so it is not called. Without profiling the ladder stops at CUDA_REGISTERED, and the diagnostic does not claim the two profile-dependent states it cannot observe. The speed-up is TRUE for a transformer forward pass and FALSE for point calls (EXP-009C: 17.49 µs per call against ~62 ns for a BIR evaluation). There is still no COMMITTED benchmark for the ONNX provider path: the 191.367 ms against 15.190 ms figures come from an ad-hoc probe that was never preserved."
    risks:
      - "LD_LIBRARY_PATH is consulted by the OS loader for EVERY native library the process loads, so a wrong library there can break unrelated native code. The launcher prepends only .onnx_libs, and only when the directory exists, so a fresh clone behaves exactly as before."
      - "the claim was published as true and the hardware report of the W620 wave recorded 'the GPU is unavailable to this machine' — both are loader-path facts, not hardware facts"
    owner: "the owner (NO — the claim is false as written; it needs the owner's decision)"
    decision_ref: "docs-v2/engineering/W46-CAPABILITY-RECONCILIATION.csv row W46-GPU; docs-v2/engineering/W46-HARDWARE-AND-RESOURCE-REPORT.md §6"
    last_verified_commit: "a6ded23338e069b8bc8a3744c234be5a03995f43"
    last_verified_at: "2026-11-04"
    next_verification_condition: "a COMMITTED benchmark for the ONNX provider path — the 191.367 ms against 15.190 ms figures come from an ad-hoc probe that was never preserved, and a number nobody can re-run is not a measurement. The owner must also decide whether the GPU is in scope for MATRIX at all."
    notes: "W47 (OD-028) changed this row. The CSV's integration cell was 'NOT INTEGRATED (the registration fails)', which is not a member of this registry's integration vocabulary, and its operational cell was 'INACTIVE', which is not a member of the operational vocabulary: the axes now say what the wave measured — INTEGRATION_TESTED, TESTED and SERVED — and the CSV keeps its literal cells as the historical record."

