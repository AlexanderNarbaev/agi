    test_evidence: "executed — 7 cases in the load-endpoint suite and 12 in the snapshot suite (the W46 measurement). W48 added the guard of the invariant: SnapshotRetentionBoundTest covers the completeness refusal and the payload bound, and the whole cognitive+knowledge scope passes on 2026-11-06 with 133 classes / 968 tests / 0 failures / 0 errors."
    benchmark_evidence: "none"
    formal_spec: "none"
    dependencies:
      - "io.matrix.knowledge.WorkspaceSnapshot (the recovery point)"
      - "io.matrix.knowledge.WorkspaceReplacementRefused (the refusal)"
      - "io.matrix.knowledge.SnapshotCoverage (what the recovery point actually carries)"
    limitations: "the snapshot is taken in the same transaction; there is no HTTP endpoint for reading a snapshot, so the recovery point is inspectable only programmatically through store.workspaceSnapshots(workspaceId). The completeness guard is a REFUSAL, not a repair: a replacement whose snapshot cannot be complete does not happen at all, and the refusal is the caller's to handle."
    risks:
      - "the erasure set predates the observation tables: a replacement erases the evidence rows the observation wrote while keeping the case, the disposition and the adjudication history (R-W46-01, Q-W46-03 — the owner's decision D3-c)"
      - "the consent parameter's SHAPE is unsettled: the implementation uses the query parameter ?replace=true and the W46 target contract names a body field replaceExisting (Q-W46-01)"
      - "the snapshot payload is now BOUNDED at 8 MiB by default, so a workspace whose payload crosses the bound cannot be replaced at all until the bound is raised — the refusal is SNAPSHOT_PAYLOAD_TOO_LARGE and it rolls the transaction back"
    owner: "the owner (YES)"
    decision_ref: "docs-v2/engineering/W46-CAPABILITY-RECONCILIATION.csv row W45-FAILCLOSED; docs-v2/engineering/W45.2-STATUS.md §2; docs-v2/engineering/W48-SNAPSHOT-RETENTION.md §6"
