    id: "W45-FAILCLOSED"
    name: "the destructive reload fails closed"
    description: "POST /v1/workbench/workspaces/{id}/load refuses to replace a non-empty workspace unless the caller passes ?replace=true, and takes a snapshot in the SAME transaction as the replacement, so a replacement cannot happen without a recovery point. Since W48 the recovery point is also CHECKED: the replacement is refused outright when the snapshot it would take is not COMPLETE — the typed refusal KnowledgeStore.IncompleteSnapshotException, identifier SNAPSHOT_NOT_COMPLETE — and the guard runs BEFORE the erasure, so the workspace is exactly as it was."
    domain: "durability"
    implementation: "IMPLEMENTED"
    integration: "INTEGRATION_TESTED"
    verification: "TESTED"
    operational: "SERVED"
