    serving_chain: "chain-a"
    serving_path: "POST /v1/workbench/workspaces/{id}/load — the destructive load route, whose consent parameter is ?replace=true"
    test_paths:
      - "matrix-core/src/test/java/io/matrix/knowledge/WorkspaceLoadEndpointTest.java"
      - "matrix-core/src/test/java/io/matrix/knowledge/WorkspaceSnapshotTest.java"
