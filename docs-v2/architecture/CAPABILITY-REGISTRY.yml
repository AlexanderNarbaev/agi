      - "the coverage contract refuses an INCOMPLETE LEGACY payload only when the TARGET holds rows of the missing family; against a target that holds none of them the legacy payload is accepted, and the restored workspace then has less history than the build that wrote the payload — the refusal is conditional on what the target holds"
      - "the retention calendar keeps up to 23 snapshots per workspace (7 daily, 4 weekly, 12 monthly) and the pass is not scheduled, so a workspace replaced daily keeps growing until somebody runs the tool"
    owner: "the owner (YES)"
    decision_ref: "docs-v2/engineering/W46-CAPABILITY-RECONCILIATION.csv row W45-SNAPSHOT; docs-v2/engineering/W45.2-STATUS.md §2; docs-v2/engineering/W48-SNAPSHOT-RETENTION.md; OD-039"
