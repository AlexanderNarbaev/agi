  -
    id: "W50-REVISION-DECIDER"
    name: "the revision decision — whether new evidence revises the model"
    description: "io.matrix.knowledge.ModelRevisionDecider: the decider that says whether a new claim revises the established model. It weighs the relatedness of the propositions, uses the text of the new source as a bridge to the older claim's subject, compares the strength — the authored confidence, the number of independent sources, the authority and the freshness — and holds the one branch the demonstration needed, a DENIAL: a new claim that denies what the earlier claim asserted revises it even when the two rest on the same evidence. The rule is topic-agnostic; there is no branch for the subject the demonstration used."
    domain: "learning"
    implementation: "IMPLEMENTED"
    integration: "INTEGRATION_TESTED"
    verification: "MEASURED"
    operational: "SERVED"
    source_paths:
      - "matrix-core/src/main/java/io/matrix/knowledge/ModelRevisionDecider.java"
      - "matrix-core/src/main/java/io/matrix/knowledge/KnowledgeRevision.java"
      - "matrix-core/src/main/java/io/matrix/knowledge/KnowledgeRefiner.java"
    production_callers:
      - "io.matrix.knowledge.acquisition.AcquisitionCycle — matrix-core/src/main/java/io/matrix/knowledge/acquisition/AcquisitionCycle.java"
    serving_chain: "chain-a"
    serving_path: "POST /v1/learning/workspaces/{id}/learn — the cycle applies the decisions the decider returns; POST /v1/learning/workspaces/{id}/revise — the acquisition of one named document of the pool with the comparison against the model"
    test_paths:
      - "matrix-core/src/test/java/io/matrix/knowledge/acquisition/AcquisitionCycleTest.java"
    test_evidence: "executed on 2026-11-07 inside the targeted W50 scope — 60 tests in 11 classes, 0 failures, 0 errors, 0 skipped; the decision is exercised by AcquisitionCycleTest (4 tests), which decides the revision on the real corpus and the real store. The evidence is the JUnit XML under matrix-core/build/test-results/test/ — TEST-io.matrix.knowledge.acquisition.AcquisitionCycleTest.xml among the eleven files of the scope."
    benchmark_evidence: "the measured four-turn run of 2026-11-07 on the packaged jar at 127.0.0.1:9091, reproducible by scripts/run-local.sh and the four prompts of docs-v2/demos/local-learning-loop/OWNER-SEQUENCE.md, recorded in docs-v2/engineering/W50-STATUS.md §3: the revision of turn 4 added 14 claims and applied exactly 1 supersession with a relatedness of 0.83, the earlier claim was kept as SUPERSEDED version 2 and the new claim was SUPPORTED version 2, and the answer moved from 118 claims of 5 sources to 128 claims of 7 sources"
    formal_spec: "none"
    dependencies:
      - "io.matrix.knowledge.KnowledgeSnapshot (the workspace before the new claim)"
      - "io.matrix.knowledge.KnowledgeRefiner (the refinement the decision builds — the decider builds it, the caller applies it)"
    limitations: "the decision rests on a lexical overlap of the two propositions and on the text of the new source as a bridge; there is no semantic relation check. The relatedness threshold is a named constant of the class, not a calibrated one. The decider decides and builds the refinement; the caller applies it through KnowledgeRefiner, so the decider writes nothing itself. The run recorded that the superseded claim stays in the history rather than disappearing."
    risks:
      - "a relatedness score is not a truth test: a new source that talks about the same subject in different words can be judged unrelated, and a source that repeats the same words can be judged related"
    owner: "the owner (W50, 2026-11-07 — the revision rule is the wave's own; the boundary around it is OD-050)"
    decision_ref: "docs-v2/engineering/W50-STATUS.md §2 and §3; docs-v2/governance/DECISION-REGISTER.md OD-050"
    last_verified_commit: "71b5b5c6"
    last_verified_at: "2026-11-07"
    next_verification_condition: "a change to the relatedness rule, to the denial branch or to the strength comparison requires the W50 targeted scope to be re-run and the turn-4 revision to be repeated"
    notes: "ADDED IN W50. The one supersession of the measured run is a denial: the new claim denied what the earlier claim asserted, and the earlier claim was kept in the store as SUPERSEDED version 2 with its source, which is the point of the demonstration — the previous model stays historically inspectable."

  -
    id: "W50-PREMISE-ASSESSMENT"
    name: "the premise check — a statement against the evidence the workspace holds"
    description: "io.matrix.knowledge.PremiseAssessment: the check that puts a statement against the claims the workspace already holds and returns SUPPORTED, CONTRADICTED, UNSUPPORTED or UNRESOLVED, with the disputed premise and the contradicting claim and its source named. It never writes: an assertion is an input to evaluate, not a confirmation, and the assessment says so in its own knowledge-effect field. It is deterministic and lexical — no model, no network, no random number and no wall-clock in any decision path — and it is domain-neutral."
    domain: "reasoning"
    implementation: "IMPLEMENTED"
    integration: "INTEGRATION_TESTED"
    verification: "TESTED"
    operational: "SERVED"
    source_paths:
      - "matrix-core/src/main/java/io/matrix/knowledge/PremiseAssessment.java"
      - "matrix-core/src/main/java/io/matrix/knowledge/KnowledgeRetriever.java"
    production_callers:
      - "io.matrix.knowledge.LearningCycleResource — matrix-core/src/main/java/io/matrix/knowledge/LearningCycleResource.java"
    serving_chain: "chain-a"
    serving_path: "POST /v1/learning/workspaces/{id}/assess — the check of one assertion against the workspace; the route refuses a blank assertion and writes nothing"
    test_paths:
      - "matrix-core/src/test/java/io/matrix/knowledge/PremiseAssessmentTest.java"
    test_evidence: "executed on 2026-11-07 inside the targeted W50 scope — 60 tests in 11 classes, 0 failures, 0 errors, 0 skipped; the check's own suite is PremiseAssessmentTest (5 tests), which builds a real workspace and asserts that a contradicted premise is CONTRADICTED, an unknown premise is UNSUPPORTED, a stated premise is SUPPORTED, an unsettled one is UNRESOLVED, and that the claims, the evidence and the statuses are exactly what they were — nothing is written. The evidence is the JUnit XML under matrix-core/build/test-results/test/ — TEST-io.matrix.knowledge.PremiseAssessmentTest.xml among the eleven files of the scope."
    benchmark_evidence: "none — the check returns a verdict, not a number. The verdict of the measured run is recorded in docs-v2/engineering/W50-STATUS.md §3: CONTRADICTED with promoted = false"
    formal_spec: "none"
    dependencies:
      - "io.matrix.knowledge.KnowledgeRetriever (the canonical retrieval the candidates come from)"
      - "io.matrix.knowledge.KnowledgeWorkbench (the snapshot it reads)"
    limitations: "the check is LEXICAL: it matches terms, so a truncated premise can read as contradicted by any claim that covers its terms. A semantic relation check does not exist. The absence of evidence is reported as UNSUPPORTED and never as a contradiction, and an assessment is a reading of the stored claims, not a judgement of their truth. The deployment measured is the local demonstrator on 127.0.0.1:9091."
    risks:
      - "a lexical match can make a claim look contradicted where the text only overlaps; the verdict names the claim and its source so that a reader can check it"
    owner: "the owner (OD-051, 2026-11-07)"
    decision_ref: "docs-v2/governance/DECISION-REGISTER.md OD-051; docs-v2/engineering/W50-STATUS.md §2 and §6"
    last_verified_commit: "71b5b5c6"
    last_verified_at: "2026-11-07"
    next_verification_condition: "a change to the premise rules, to the verdict vocabulary or to the retrieval the candidates come from requires the W50 targeted scope to be re-run"
    notes: "ADDED IN W50. The class is not the earlier io.matrix.knowledge.PremiseChecker: the checker of the older waves and this assessment are different components, and this row is about the assessment. The premise the measured run contradicted is the claim that the idea that the continents could move was widely rejected when it was first proposed, and the contradicting claim is in wikipedia-continental-drift.md."

