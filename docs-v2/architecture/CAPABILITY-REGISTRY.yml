    test_paths:
      - "matrix-core/src/test/java/io/matrix/bridge/BridgeServiceTest.java"
      - "matrix-core/src/test/java/io/matrix/bridge/NeuroSymbolicBridgeTest.java"
      - "matrix-core/src/test/java/io/matrix/contract/bridge/KnowledgeDirectionTest.java"
      - "matrix-core/src/test/java/io/matrix/bridge/KnowledgePublisherTest.java"
      - "matrix-api-gateway/src/test/java/io/matrix/api/bridge/KnowledgeBridgeTest.java"
    test_evidence: "the bridge scope: 76 tests, 0 failures, over the protocol, the service, the journal, the audit, the sink and the publisher. The cross-process run — scripts/w51-bridge-demo.sh — is the integration evidence: 10 checks, 0 failed, with chain A started as a real Quarkus process and chain B's publisher in a separate JVM. The first publication is ACCEPTED; a true retry of the same request id is answered with the ORIGINAL outcome and the SAME audit id; the same request id reused for a different payload is REFUSED with the conflict named; a forged signature is REFUSED with the signature named; the bridged workspace of chain A holds exactly one claim after three deliveries; and the owner's epistemic database is byte-identical before and after."
    benchmark_evidence: "scripts/w51-bridge-demo.sh — the cross-process demonstration, reproducible in one command; the isolation gate's G7, G8 and G9 and the negative controls C3 and C4 are the measurement that the crossing is the only one. The bridge receiver's audit chain was measured before and after its change: 23 279 to 40 914 bytes per call at 1000 to 10 000 messages, and 13 372, 13 203, 13 072 and 13 033 bytes per call after it — flat."
    formal_spec: "none"
    dependencies:
      - "the chain-A application on 127.0.0.1:9091 — the receiver's HTTP surface"
      - "the shared secret that signs the envelope — an environment variable, never a file in the repository"
      - "the chain-B brain runtime and its publisher CLI"
    limitations: "the second direction carries PROPOSITIONS AND THEIR STANDING, and nothing else: the brain's answer does not come back as a claim the epistemic store can weigh. Chain B's request-id registry for the second direction is process-scoped — the effect itself is idempotent, because the brain's document id is derived from the content, but a restart of chain B between two deliveries of the same request id would teach the proposition twice. The demonstration of the crossing is the cross-process script and the gate, not a two-server deployment."
    risks:
      - "the second direction hands chain B propositions the epistemic core has established; a compromise of the shared secret would let anyone assert what the core knows — the audit records the refusal but cannot prevent the attempt"
