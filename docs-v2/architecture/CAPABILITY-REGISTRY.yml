  -
    id: "W51-BRIDGE"
    name: "the bridge: the one governed crossing between the two serving chains"
    description: "The contract BRIDGE-1 to BRIDGE-10 that the repository wrote down in W45.2 and never implemented. Chain B publishes an observation over HTTP with an HMAC signature; chain A receives it, checks the signature, the capability, the budget and the version, writes a durable journal entry, and records the observation as an UNVERIFIED CANDIDATE with a SECONDARY_REPORT source. The request id is the idempotency key, the retry policy is explicit, the queue is bounded, and the audit is durable. W52 added the SECOND direction: chain A's epistemic core offers what it has ESTABLISHED — the canonical Belief with its status, its confidence, its evidence and its provenance — and chain B's brain takes it into its own memory, so that the brain can answer with what the epistemic core knows. The direction is carried by the RIGHT and not by a flag: chain A's bridge grants OBSERVATION, CANDIDATE and EVIDENCE_LINK, and chain B's bridge grants KNOWLEDGE, so a message of the wrong direction is refused for the same reason a forged one is. The protocol moved to version 2, and the version rule reads version 1 as well: a message of a version this build has never heard of is still refused with its number named."
    domain: "integration"
    implementation: "IMPLEMENTED"
    integration: "INTEGRATED"
    verification: "INTEGRATION_TESTED"
    operational: "SERVED"
    serving_chain: "both"
    serving_path: "POST /v1/bridge/messages and GET /v1/bridge/status on chain A (io.matrix.bridge.BridgeResource); the publisher is io.matrix.brain.runtime.bridge.BridgePublisher, and the CLI that starts it is io.matrix.brain.runtime.bridge.BridgePublisherCli. The gateway's production client is io.matrix.api.brain.ProductionBrainClient. The SECOND direction: POST /v1/bridge/knowledge on chain B (io.matrix.api.bridge.KnowledgeBridge), published by io.matrix.bridge.KnowledgePublisher, whose command-line face is io.matrix.bridge.KnowledgePublisherCli."
    source_paths:
      - "matrix-core/src/main/java/io/matrix/bridge/BridgeResource.java"
