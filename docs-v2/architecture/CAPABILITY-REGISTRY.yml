  -
    id: "W51-WORLD-STATE-MEMORY"
    name: "the world-state memory: the system's estimate of a domain and the transitions it caused"
    description: "io.matrix.cognitive.worldstate — the sixth memory role the mandate names, and the one the W51 audit found missing. It holds the current estimate of a domain in the canonical WorldState and Property records, and every change as a canonical StateTransition with its cause, its action and the belief status it was recorded under. It is consulted BEFORE an action, so that the system knows what it believes about the world before it changes it. It is a PROJECTION over the append-only case log: it is rebuilt by replaying the log, so it survives a restart without a sixth database and cannot disagree with the log it is derived from."
