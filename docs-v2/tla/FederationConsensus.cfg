\* W371 — TLA+ model checker configuration for FederationConsensus.
\* 
\* Defines model values and constants for TLC verification.
\* Run with: tlc FederationConsensus.tla -config FederationConsensus.cfg

SPECIFICATION Spec

\* Constants
CONSTANTS
    L0 = L0
    L1 = L1
    L2 = L2
    L3 = L3
    L4 = L4
    L5 = L5
    L6 = L6
    L7 = L7
    Weight = (L0 :> 0 @@ L1 :> 0 @@ L2 :> 1 @@ L3 :> 2 @@ L4 :> 3 @@ L5 :> 5 @@ L6 :> 8 @@ L7 :> 10)
    STANDARD_THRESHOLD = 67 \div 100

\* Symmetry permutation for state space reduction
SYMMETRY Permutations(L0, L1, L2, L3, L4, L5, L6, L7)

\* Invariants to check
INVARIANT Safety
INVARIANT TypeOK
INVARIANT VetoInvariance
INVARIANT ApprovalThreshold
INVARIANT WeightMonotonic
INVARIANT VetoOverridesApproval

\* Properties to verify
PROPERTY SafetySpec
