\* The knowledge store's persistence semantics.
\*
\* The configuration carries only sets. A function of claims to strings cannot
\* be written here - the configuration format cannot carry a function value -
\* so the model's "which claim does this evidence point at" is expressed by
\* the constant Backed, the subset of claims that at least one evidence link
\* points at.

SPECIFICATION Spec

CONSTANTS
    Claims = {c1, c2, c3}
    Backed = {c1, c2}
    Sources = {s1, s2}
    Workspaces = {w1}
    MaxVersion = 4
    MaxSteps = 3

\* TLC rejects formulas with primes or temporal operators in the INVARIANTS
\* section, so the temporal properties are listed under PROPERTIES.

INVARIANTS
    TypeOK
    EvidenceHasClaim
    BackedHasSource
    SchemaAtLeastOne
    ImportIsAtomic
    VersionNotBelowFloor
    CountersNotBelowFloor

PROPERTIES
    EvidenceAlways
    SourceAlways
    VersionNeverDecreases
    CountersNeverDecrease

CHECK_DEADLOCK FALSE
