\* TLC configuration for BRC-Step.
\* Per CONSTITUTION II, K_MAX = 20.
\* Per TRACEABILITY.md T1, BRC-step is a state transition.
\*
\* RECON-W38.5: the three invariants that used to be listed here were
\* constant-level — the module's helpers were stubs (HammingDist == 0,
\* SuperStep == s1, ApplyFn == CHOOSE ... TRUE), so they evaluated to TRUE
\* without ever looking at the model, and the state machine (applied / result /
\* stepState) was constrained by NOTHING. The step set, the step functions and
\* the vector space are now defined in the module, so Steps / Inputs / Outputs
\* are no longer configuration constants.
\*
\* The INVARIANTS below now constrain the state machine, and the PROPERTIES
\* are the composition laws over the modelled step set. TLC reports the laws
\* as constant-level — they are algebraic laws and do not depend on the state
\* by nature.

SPECIFICATION Spec

CONSTANTS
    Alpha = 1

INVARIANTS
    TypeOK
    AppliedResultMatchesFn
    ConvergenceIsComputed

PROPERTIES
    ComposeEndpointPreserved
    ComposeAssociative
    ComposeIdentity
    ConvergenceReachable

CHECK_DEADLOCK FALSE
