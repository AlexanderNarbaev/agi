\* TLC configuration for BRC-Step.
\* Per CONSTITUTION II, K_MAX = 20.
\* Per TRACEABILITY.md T1, BRC-step is a state transition.
\*
\* The three invariants below are the safety properties actually defined in
\* BrcStep.tla. The former entries TypeInvariant, StepStateWellDefined and
\* FanInConstraint are not defined in that module, so TLC rejected the config
\* with "is not defined in the specification".

SPECIFICATION Spec

CONSTANTS
    Steps = {step_1, step_2, step_3}
    Inputs = {"i0", "i1", "i2", "i3"}
    Outputs = {"o0", "o1", "o2", "o3"}
    Alpha = 1

INVARIANTS
    ComposeEndpointPreserved
    ComposeAssociative
    ComposeIdentity

CHECK_DEADLOCK FALSE
