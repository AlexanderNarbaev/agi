\* TLC configuration for LearningStateMachine.tla
\* Usage: java -jar tla2tools.jar -config LearningStateMachine.cfg LearningStateMachine.tla

SPECIFICATION Spec

CONSTANTS
    MAX_TRANSITIONS = 4

INVARIANTS
    TypeOK
    NoSelfTransition
    AdvanceIsOneStep
    NeverAboveTheTop

\* MAX_TRANSITIONS bounds the model, so a chain of maximal length legitimately
\* has no enabled action; that terminal state is not a defect.
CHECK_DEADLOCK FALSE
