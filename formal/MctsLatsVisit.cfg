\* TLC configuration for MCTS-LATS visit convergence.
\* Per SPEC-008, MCTS-Visit is convergent.
\* Per ALGORITHM-ATLAS §38-40.
\*
\* `Visits` was shrunk from {0, 1, 2, 3, 4, 5} to {0, 1, 2}: the visit count
\* of a node is the product of the reachable visit/reward pairs and of the
\* reachable child sets, and the six-level budget gave a state space of
\* ~24 million states — far past the two-minute budget. The set of checked
\* properties is unchanged; only the model shrank.
\*
\* `Convergence` is a state predicate (no primes, no temporal operators) and
\* therefore goes under INVARIANTS; every other property of the module is a
\* temporal formula and goes under PROPERTIES.

SPECIFICATION Spec

CONSTANTS
    Nodes = {"n1", "n2", "n3"}
    Visits = {0, 1, 2}
    AlphaRoot = 1

INVARIANTS
    Convergence

PROPERTIES
    VisitsMonotone
    BestArmIsArgmax
    TreeAcyclic
    SearchTerminates

CHECK_DEADLOCK FALSE
