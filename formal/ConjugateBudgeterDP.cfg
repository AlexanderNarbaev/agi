\* TLC configuration for ConjugateBudgeterDP.
\* Per DESIGN-11 §3, H-021; docs-v2/designs/DRAFT-ConjugateDP.md.
\*
\* `Rows` is the set of candidate rows 1..3. `Values` and `Costs` are the
\* per-row numbers: sets of three distinct numbers each, so that row i takes
\* the i-th smallest element of each (the module's V and C operators).
\* `Alpha = 1` is the smoothing factor of the per-period update — the module
\* models it as an integer in {0, 1}.
\*
\* `CONSTRAINT EpochBound` restricts the model to the first TotalCost
\* epochs: `epoch` is an unbounded counter, so the unconstrained state space
\* is infinite. The constraint prunes explored states only; it does not
\* weaken any property.
\*
\* Every property of the module is a temporal formula (a box of a state or
\* action formula, or an eventual), so all of them are listed under
\* PROPERTIES — TLC's INVARIANTS section accepts state predicates only.

SPECIFICATION Spec

CONSTANTS
    Rows = {1, 2, 3}
    Values = {3, 5, 9}
    Costs = {2, 3, 4}
    Alpha = 1

CONSTRAINT EpochBound

PROPERTIES
    SpentWithinEnvelope
    ShadowFinite
    ShadowBounded
    LambdaBounded
    FiniteHorizon
    ShadowBoundedPeriod

CHECK_DEADLOCK FALSE
