\* TLC configuration for MemoryM4Causal.tla — Memory M4 causal CRDT layer.
\*
\* Model (deliberately small, but every action of the module is reachable):
\*   Replicas   = {r1, r2}    two replicas, so that Merge(r1, r2) and
\*                             Merge(r2, r1) are both exercised
\*   Keys       = {k1, k2, kf} two ordinary keys plus one FROZEN key
\*   FrozenKeys = {kf}        FROZEN key is a subset of Keys: it can be
\*                             observed by Freeze but never inserted
\*   Epochs     = {0, 1}      two epochs; epoch 1 is needed to show that a
\*                             tombstone does not stop a re-insert at a
\*                             lower epoch (F2 counterexample)
\*
\* INVARIANTS lists the only property of the module that is a state
\* predicate.  TLC rejects formulas with primes or temporal operators in the
\* INVARIANTS section ("is not a state predicate"), so the three remaining
\* properties — which are temporal formulas — are listed under PROPERTIES.

SPECIFICATION Spec

CONSTANTS
    Replicas = {r1, r2}
    Keys = {k1, k2, kf}
    Epochs = {0, 1}
    FrozenKeys = {kf}

INVARIANTS
    TombstoneIrreversible

PROPERTIES
    MonotonicityExceptTombstone
    FrozenImmutability
    EventualConsistency
