\* TLC configuration for BotEthicsPipeline.tla

SPECIFICATION Spec

CONSTANTS
    MAX_BOTS = 2
    MAX_TICKS = 3
    \* RECON-W38.4: the bot and action universes are model constants, because
    \* TLC cannot enumerate the infinite set STRING inside a temporal formula.
    \* Two bots is the smallest universe that exercises registration, approval
    \* and rejection; two actions (one containing the kill trigger, one not)
    \* exercise the LIV-2 branch and its negative case.
    BotIds = {"b1", "b2"}
    ActionIds = {"act:ok", "act:kill-now"}
    \* RECON-W38.5: the action texts the FROZEN FNL rejects. The Java takes
    \* this from the FNL's trigger set, which is data; the model takes it from
    \* a constant. One action triggers, one does not - the negative case is
    \* what shows the decision is driven by the verdict and not by the model.
    FnlTriggers = {"act:kill-now"}

\* RECON-W38.4: TLC's INVARIANTS section accepts only state predicates - a
\* formula with primes or temporal operators is rejected with "is not a state
\* predicate" and the run aborts before checking anything. BotsMonotonicExpand
\* is a temporal formula ([][ bots' \subseteq bots ]_bots), so it belongs
\* under PROPERTIES. No check was removed: the same five properties are still
\* evaluated, three of them as state invariants and the temporal ones as
\* properties.
INVARIANTS
    TypeOK
    ApprovalsPlusRejectionsEqualsTicks
    TombstonesEqualsRejections
    AuditChainLengthEqualsDecisions
    AuditLinksAreTyped
    FnlVerdictIsFollowed

PROPERTIES
    BotsMonotonicExpand
    BotsMonotonic
    EveryBotEventuallyTicked

\* RECON-W38.4: "SYMMETRY Permutations" was never a valid symmetry set -
\* Permutations(S) in the TLC module takes an argument, and a bare reference
\* is an operator, not a set of permutations. The model is small enough to
\* explore without symmetry reduction, so the directive is dropped rather
\* than pointed at a wrong argument.
CHECK_DEADLOCK FALSE
