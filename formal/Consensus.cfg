\* TLC configuration for Consensus.
\* Per L2 §3.1 (Consensus), CRITICAL_GAPS.md GAP-021.
\*
\* `Threshold = 2` is the two-of-three majority of the three agents.
\* `Records` is the set of admissible proposal values; a proposal record is
\* the tuple <<agent, value>> built from `Agents` and `Records`, and
\* `Decisions` holds the two decision values APPROVED / REJECTED.

SPECIFICATION Spec

CONSTANTS
    Agents = {"a1", "a2", "a3"}
    Proposals = {"p1", "p2"}
    Decisions = {"APPROVED", "REJECTED"}
    Threshold = 2
    APPROVED = "APPROVED"
    REJECTED = "REJECTED"
    Records = {"v1", "v2"}

INVARIANTS
    TypeOK

PROPERTIES
    DecisionMonotonic
    WeightedIdempotent
    LivenessBounded

CHECK_DEADLOCK FALSE
