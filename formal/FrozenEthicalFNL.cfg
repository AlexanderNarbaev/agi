\* TLC configuration for FrozenEthicalFNL.
\* Per CONSTITUTION IV, the four prohibitions must be enforced.
\* Per SPEC-006, ActionGate check is mandatory before any action.
\*
\* The trigger relation is supplied as flat sets: the pair (axiom a, feature
\* set F) is written as {a} ∪ F, i.e. the axiom name together with the names
\* of the feature bits of F. The configuration-file grammar can express sets,
\* numbers, strings and model values but never a function, so the module's
\* `Triggers` operator rebuilds the per-axiom trigger sets from the pairs.
\* The previous entry `Triggers = [a \in Axioms |-> {}]` was not parseable by
\* TLC for that reason; the pair form carries the same semantics.
\*
\* Every property of the module is a temporal formula (a box of an action
\* formula, or a box of an eventual), so all of them are listed under
\* PROPERTIES — TLC's INVARIANTS section accepts state predicates only.

SPECIFICATION Spec

CONSTANTS
    Axioms = {"axiom1", "axiom2", "axiom3", "axiom4", "axiom5", "axiom6"}
    FeatureBits = {"f0", "f1", "f2", "f3"}
    \* RECON-W38.4: the trigger relation was empty, so no axiom ever fired and
    \* every property was exercised only in its trivial case (the model had a
    \* single state). The flat-set encoding is {axiom name} \union {feature
    \* bits}, so these four entries give axiom1 two triggers, axiom2 one and
    \* axiom3 one - enough to exercise activation, determinism, the fired
    \* subset and the canonical neuron set over a non-trivial state space.
    TriggerPairs = {{"axiom1", "f0"},
                    {"axiom1", "f0", "f1"},
                    {"axiom2", "f1"},
                    {"axiom3", "f0", "f2"}}

PROPERTIES
    NeuronSetImmutable
    DeterministicActivation
    FiredSubsetOfTotal
    NeuronsAreCanonical
    Liveness

CHECK_DEADLOCK FALSE
