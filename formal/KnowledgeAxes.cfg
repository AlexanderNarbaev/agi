\* The three epistemic axes of a claim, the recorded derivations and the
\* recorded conflicts.
\*
\* The configuration carries only sets and numbers. A claim's layer and
\* warrant are functions, which the configuration format cannot carry, so the
\* model builds them from the constants.

SPECIFICATION Spec

CONSTANTS
    \* The state space is the product of the layers, the warrants and the
    \* derivation statuses over every claim, so it is bounded deliberately:
    \* two claims and one rule already exercise every transition, and a
    \* third claim multiplies the space by a factor of about a hundred.
    Claims = {c1, c2}
    Rules = {r1}
    MaxRules = 2

\* TLC rejects formulas with primes or temporal operators in the INVARIANTS
\* section, so the temporal properties are listed under PROPERTIES.

INVARIANTS
    EstablishedHasWarrant
    InferredNamesADerivation
    ValidDerivationIsRecorded
    ConflictsChangeNothing
    NothingIsDeleted
    ConflictsArePairs

PROPERTIES
    WarrantMonotone
    DerivationsAreKept
    ConflictsAreKept
    SupersededIsKept

CHECK_DEADLOCK FALSE
