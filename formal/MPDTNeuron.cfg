\* TLC configuration for MPDTNeuron.tla
\* Usage: java -cp tla2tools.jar tlc2.TLC -config MPDTNeuron.cfg MPDTNeuron.tla
\*
\* All four invariants declared by the module are checked here. TLC's INVARIANTS
\* section only accepts state predicates ("one with no primes or temporal
\* operators"), so KBounded, OutputDeterminedByInputs and
\* OutputStableUnderIdempotentInput — all of them temporal ([]) formulas — are
\* checked under PROPERTIES instead; listing only the state predicate would
\* silently drop three of the four.

SPECIFICATION Spec

CONSTANTS
    \* Truth-table dimension bound. K_MAX = 2 keeps the per-neuron truth table
    \* at 2^2 = 4 bits, so the state space stays small while still covering
    \* both k = 1 and k = 2 (the K_MAX ceiling is not trivially satisfied).
    K_MAX = 2
    \* Set of neuron ids. Two neurons are enough to exercise the per-neuron
    \* quantifiers (and the cross-neuron interaction in Evaluate) without
    \* blowing up the state space.
    Neurons = {"n1", "n2"}

INVARIANTS
    KMaxIsGlobalCeiling

PROPERTIES
    KBounded
    OutputDeterminedByInputs
    OutputStableUnderIdempotentInput
