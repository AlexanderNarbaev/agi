\* Alternative configuration for the ConjugateBudgeterDP mutation harness.
\*
\* The shipped configuration uses row costs 2, 3 and 4, whose gcd is 1. With a
\* grid unit of one raw unit the reduced-grid slope and the raw-unit slope
\* COINCIDE, so a mutant that computes the wrong slope cannot be told apart
\* from a correct one. This configuration uses costs 4 and 6, whose gcd is 2:
\* there the Java's grid unit is two raw units and the two slopes differ.
\*
\* The Java instance this mirrors: rows (v=1, c=4) and (v=100, c=6) at
\* envelope 7 - the Java reports lambda = V*(6) - V*(4) = 100 - 1 = 99, while
\* the raw-unit slope would be V*(7) - V*(6) = 0.
\*
\* This file lives under formal/mutations/ so that the CI job, which iterates
\* formal/*.cfg, does not model-check it as a separate specification.

SPECIFICATION Spec

CONSTANTS
    Rows = {1, 2}
    Values = {1, 100}
    Costs = {4, 6}
    Alpha = 1

CONSTRAINT EpochBound

PROPERTIES
    SpentWithinEnvelope
    ShadowFinite
    ShadowBounded
    LambdaBounded
    FiniteHorizon
    ShadowBoundedPeriod

CHECK_DEADLOCK FALSE
