\* W371 -> W47. The TLC configuration for the local consensus engine.
\*
\* PROVENANCE:
\*   W371, 2026-09-18 — created as docs-v2/tla/FederationConsensus.cfg
\*                      (commit 4a208c9d; docs-v2/waves/WAL-371.md)
\*   W47, 2026-11-05 — moved into formal/ under OD-030, so that the formal gate
\*                      checks it. The copy kept at the old path
\*                      (docs-v2/tla/) is the same file; formal/ is the gated one.
\*
\* WHAT W47 CHANGED, AND WHY (the details are in the module's header):
\*   * the weight table left the configuration: a .cfg file cannot express a
\*     function ("TLC found an error in the configuration file at line 18"), so
\*     Weight(level) is an operator of the module now;
\*   * STANDARD_THRESHOLD became STANDARD_THRESHOLD_PERCENT = 67, and the
\*     module compares 100 * yesWeight >= 67 * totalWeight. "67 \div 100" is not
\*     a value the .cfg format can express, and integer division would have
\*     made the threshold zero. The comparison is exactly the Java's
\*     "yesWeight / totalWeight >= 0.67";
\*   * the SYMMETRY line is gone: the .cfg format cannot carry a permutation
\*     expression, and permuting the levels would not preserve the model, because
\*     the levels carry different weights;
\*   * PROPERTY SafetySpec now names a definition. The W364 module declared it
\*     as a THEOREM, which TLC cannot check;
\*   * CHECK_DEADLOCK FALSE, the convention the other bounded models in this
\*     directory use: the voter universe is bounded, so the state in which every
\*     voter has voted has no enabled action. That terminal state is an artefact
\*     of the finite universe, not a defect of the engine.
\*
\* Usage: java -jar tools/tla2tools.jar -config FederationConsensus.cfg
\*                                           FederationConsensus.tla
\*
SPECIFICATION Spec

CONSTANTS
    L0 = L0
    L1 = L1
    L2 = L2
    L3 = L3
    L4 = L4
    L5 = L5
    L6 = L6
    L7 = L7
    Voters = {v1, v2, v3}
    STANDARD_THRESHOLD_PERCENT = 67

INVARIANTS
    Safety
    TypeOK
    VetoInvariance
    ApprovalThreshold
    WeightMonotonic
    VetoOverridesApproval

PROPERTIES
    SafetySpec

CHECK_DEADLOCK FALSE
