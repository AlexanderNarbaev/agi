  # ───────────────────────────────────────────────────────────────────────────
  - id: BrcStep
    title: "BRC step — atomic boolean step and chain composition"
    spec: formal/BrcStep.tla
    config: formal/BrcStep.cfg
    java:
      module: matrix-core
      sources:
        - matrix-core/src/main/java/io/matrix/reasoning/BrcStep.java
        - matrix-core/src/main/java/io/matrix/reasoning/BrcChain.java
        - matrix-core/src/main/java/io/matrix/reasoning/BrcState.java
      production_callers:
        - matrix-core/src/main/java/io/matrix/reasoning/BrainLoopService.java
        - matrix-core/src/main/java/io/matrix/reasoning/ConsciousnessLoop.java
        - matrix-core/src/main/java/io/matrix/api/OpenAIChatResource.java
      production_caller_status: PRODUCTION_PATH_VERIFIED
    tests:
      unit:
        - matrix-core/src/test/java/io/matrix/reasoning/BrcChainTest.java
        - matrix-core/src/test/java/io/matrix/reasoning/BrcChainComposeTest.java
        - matrix-core/src/test/java/io/matrix/reasoning/Exp146BrcStepVerifierTest.java
      integration:
        - matrix-core/src/test/java/io/matrix/integration/BrcIntegrationTest.java
        - matrix-core/src/test/java/io/matrix/integration/BrcMctsIntegrationTest.java
        - matrix-core/src/test/java/io/matrix/integration/EndToEndTest.java
        - matrix-core/src/test/java/io/matrix/reasoning/StageLatencyTrackerIntegrationTest.java
        - matrix-core/src/test/java/io/matrix/reasoning/ConsciousnessLoopFeedbackTest.java
    properties:
      invariants: [TypeOK, AppliedResultMatchesFn, ConvergenceIsComputed]
      properties: [ComposeEndpointPreserved, ComposeAssociative, ComposeIdentity, ConvergenceReachable]
    conformance:
      status: [MODEL_CHECKED, ABSTRACT_MODEL, JAVA_UNIT_VERIFIED, INTEGRATION_VERIFIED, PRODUCTION_PATH_VERIFIED]
      gaps:
        - code: NO_PRODUCTION_CALLER
          detail: >-
            BrcChain.compose is called only from BrcChainComposeTest. THREE of
            the four configured properties constrain compose.
        - code: SEMANTIC_MISMATCH
          detail: >-
            The model's step is a total function on a fixed two-bit space; the
            Java's step is a NeuronLayer whose input is padded by pattern
            repetition to layer.outputWidth()*k bits and whose output has
            layer.outputWidth() bits. The second step of a composed chain
            receives the PADDED first-step output, so
            ApplyChain(compose(l,r),x) = ApplyFn(r, ApplyFn(l,x)) is not what
            the Java computes.
        - code: SEMANTIC_MISMATCH
          detail: >-
            The Java's compose also merges maxSteps and earlyStopping, and
            evaluate() breaks out of the loop when a step converges — so the
            composed right half may never run, and ComposeEndpointPreserved is
            false of the Java.
        - code: NAME_COLLISION
          detail: >-
            io.matrix.brain.runtime.BrcStep (matrix-brain-runtime) is an
            unrelated trace record, not the class this model describes.
        - code: NOT_TRACE_CONFORMANT
          detail: >-
            Exp146BrcStepVerifierTest calls itself a Java-side mirror of the
            specification but never touches io.matrix.reasoning.BrcStep — it
            re-implements a majority vote over boolean[].
    abstractions:
      - "The model's three concrete step functions stand in for NeuronLayer evaluations."
    assumptions:
      - "The model assumes every step has the same input and output width; the Java does not."
    limitations:
      - "Width changes and input padding are not modelled."

