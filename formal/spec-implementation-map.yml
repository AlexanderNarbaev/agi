      production_caller_status: PRODUCTION_PATH_VERIFIED
    tests:
      unit:
        - matrix-core/src/test/java/io/matrix/audit/HashChainTest.java
        - matrix-core/src/test/java/io/matrix/audit/HashChainIntegrityTest.java
        - matrix-core/src/test/java/io/matrix/audit/FrozenFNLHashChainTest.java
      integration:
        - matrix-core/src/test/java/io/matrix/ethics/FROZENFNLGuardianTest.java
        - matrix-core/src/test/java/io/matrix/e2e/MasterPipelineE2ETest.java
        - matrix-core/src/test/java/io/matrix/e2e/E2EIntegrationTest.java
        - matrix-core/src/test/java/io/matrix/agent/EthicsGuardTest.java
    properties:
      invariants: [TypeOK, VerifiedImpliesIntact]
      properties: [ChainMonotonic, LastHashConsistent, AppendKeepsChainValid, TamperDetected, RestoreVerifies]
    conformance:
      status: [MODEL_CHECKED, ABSTRACT_MODEL, JAVA_UNIT_VERIFIED, INTEGRATION_VERIFIED, PRODUCTION_PATH_VERIFIED]
      gaps:
        - code: MODEL_CORRECTED
          detail: >-
            The Java record carries sequence, previousHash, payloadHash,
            timestampMs, extra and hash; the model carried payload, extra and
            hash and derived sequence and timestamp from the chain POSITION.
            The model's record now has the Java's six fields, ChainIntact
            checks the same three things the Java's verify() checks (the
            sequence number, the stored predecessor, and the link's own hash),
            the genesis hash is exactly 64 zeros as the Java's is, and the
            tamper action mutates the payload DIGEST because the Java's link
            has no payload field.
        - code: SEMANTIC_MISMATCH
          detail: >-
            The model stores lastHash and verified as STATE; the Java computes
            latest() and verify() on demand.
        - code: NOT_TRACE_CONFORMANT
          detail: >-
            No model trace has been replayed through the Java. The model's
            hash is an opaque encoding, not SHA-256: the abstract claim is
            injectivity, not collision resistance, and the ADR says so.
    abstractions:
      - "The model's hash is an abstract deterministic encoding; the Java uses SHA-256, whose collision resistance TLC cannot prove."
    assumptions:
      - "The chain's order is the sequence number; wall-clock time is recorded but never ordered by."
    limitations:
      - "The model cannot express an attacker who rewrites the whole chain and replaces the trusted head."

  # ───────────────────────────────────────────────────────────────────────────
  - id: ConjugateBudgeterDP
    title: "Conjugate budgeter — 0/1 knapsack allocation and shadow price"
    spec: formal/ConjugateBudgeterDP.tla
    config: formal/ConjugateBudgeterDP.cfg
    java:
      module: matrix-core
      sources:
        - matrix-core/src/main/java/io/matrix/budgeter/ConjugateBudgeter.java
      production_callers:
        - matrix-core/src/main/java/io/matrix/lifecycle/ImpulseScheduler.java
        - matrix-core/src/main/java/io/matrix/autonomy/AutonomyEngine.java
        - matrix-core/src/main/java/io/matrix/autonomy/SelfImprovingEngine.java
        - matrix-api-gateway/src/main/java/io/matrix/api/llm_quarantine/BrainProduction.java
        - matrix-api-gateway/src/main/java/io/matrix/api/llm_quarantine/BrainIntegrated.java
      production_caller_status: PRODUCTION_PATH_VERIFIED
    tests:
      unit:
        - matrix-core/src/test/java/io/matrix/budgeter/ConjugateBudgeterTest.java
        - matrix-core/src/test/java/io/matrix/budgeter/ConjugateBudgeterStepTest.java
        - matrix-core/src/test/java/io/matrix/budgeter/ConjugateBudgeterVsGreedyTest.java
        - matrix-core/src/test/java/io/matrix/budgeter/ConjugateBudgeterTraceConformanceTest.java
      integration:
        - matrix-core/src/test/java/io/matrix/lifecycle/ImpulseSchedulerTest.java
        - matrix-core/src/test/java/io/matrix/research/Exp045FreezeRecoveryTest.java
        - matrix-core/src/test/java/io/matrix/reasoning/ArousalDynamicsIntegrationTest.java
        - matrix-core/src/test/java/io/matrix/reasoning/ConsciousnessLoopFeedbackTest.java
    properties:
      invariants: []
      properties:
        - SpentWithinEnvelope
        - ShadowFinite
        - ShadowBounded
        - LambdaBounded
        - FiniteHorizon
        - ShadowBoundedPeriod
    conformance:
      status: [MODEL_CHECKED, ABSTRACT_MODEL, JAVA_UNIT_VERIFIED, TRACE_CONFORMANT, INTEGRATION_VERIFIED, PRODUCTION_PATH_VERIFIED]
      gaps:
        - code: SEMANTIC_MISMATCH
          detail: >-
            The Java's fallback path returns shadowPrice = NaN; the model's
            fallback sets shadow = 0 and ShadowFinite requires a natural
            number. TLA+ has no NaN, so the model's fallback cannot state the
            Java's value; the divergence is bounded to the fallback path and
            is asserted in ConjugateBudgeterTraceConformanceTest.
        - code: SEMANTIC_MISMATCH
          detail: >-
            The model's Step ignores observedLambda entirely; the Java smooths
            the observed shadow price with SMOOTHING_ALPHA = 0.7.
        - code: NOT_MODELLED
          detail: >-
            The Java's MAX_DP_UNITS = 250000 grid-size fallback has no model
            counterpart, and the Java caps the envelope at the total row cost.
        - code: NO_PRODUCTION_CALLER
          detail: >-
            ConjugateBudgeterMulti is a DIFFERENT algorithm with no production
            caller; ConsciousnessLoop holds a budgeter but never calls it.
      corrected:
        - code: MODEL_CORRECTED
          detail: >-
            The Java reduces the DP grid by the gcd of the row costs, so its
            shadow price is dp[0][units] - dp[0][units-1] = V*(cap) -
            V*(cap-g): the marginal value of G raw units. The model computed
            V*(E) - V*(E-1), the marginal value of ONE unit. With rows
            (v=1,c=4),(v=100,c=6) at envelope 7 the Java returns lambda = 99
            while the model returned 0. The model now mirrors the Java's grid
            (GridUnit, GridCap, GridShadow) and LambdaBounded states that
            correspondence directly. The bound it carries is unchanged: one
            extra grid unit can enable at most one additional row, so the
            marginal still cannot exceed the largest single row value.
        - code: TRACE_CONFORMANCE_TEST
          detail: >-
            ConjugateBudgeterTraceConformanceTest pins the correspondence
            against the Java: rows (v=1,c=4),(v=100,c=6) give shadowPrice 99
            at envelope 7, and a sweep of envelopes 4..7 gives 1, 1, 99, 99 -
            the model's GridShadow values, confirmed by TLC over the
            configuration Rows={1,2}, Values={1,100}, Costs={4,6}.
    abstractions:
      - "The model omits the gcd grid reduction, the size fallback and the multi-period smoothing."
    assumptions:
      - "Row costs and values are naturals; the model does not model overflow."
    limitations:
      - "The shadow-price definition does not yet match the Java's reduced grid."

