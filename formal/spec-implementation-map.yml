      production_caller_status: PRODUCTION_PATH_VERIFIED
    tests:
      unit:
        - matrix-core/src/test/java/io/matrix/ethics/frozen/FrozenEthicalFNLTest.java
      integration:
        - matrix-core/src/test/java/io/matrix/ethics/EthicalFilterFrozenIntegrationTest.java
        - matrix-core/src/test/java/io/matrix/e2e/MasterPipelineE2ETest.java
        - matrix-core/src/test/java/io/matrix/e2e/E2EIntegrationTest.java
        - matrix-core/src/test/java/io/matrix/api/BotEthicsResourceTest.java
        - matrix-core/src/test/java/io/matrix/api/BotEthicsPipelineTest.java
        - matrix-core/src/test/java/io/matrix/agent/EthicsGuardTest.java
        - matrix-core/src/test/java/io/matrix/ethics/FROZENFNLGuardianTest.java
    properties:
      invariants: []
      properties:
        - NeuronSetImmutable
        - DeterministicActivation
        - FiredSubsetOfTotal
        - NeuronsAreCanonical
        - Liveness
    conformance:
      status: [MODEL_CHECKED, ABSTRACT_MODEL, JAVA_UNIT_VERIFIED, INTEGRATION_VERIFIED, PRODUCTION_PATH_VERIFIED]
      gaps:
        - code: SEMANTIC_MISMATCH
          detail: >-
            The model's trigger relation comes from the configuration file's
            four TriggerPairs, and axioms 4, 5 and 6 have EMPTY trigger sets.
            The Java has no trigger relation at all: canonical() materialises
            2^16-entry truth tables, so effectively
            Triggers[a] = { F ⊆ {0..15} : bit(a) ∈ F } over a SIXTEEN-bit
            universe, and TRUTHFULNESS and PRIVACY DO fire — a network state
            the model cannot represent.
        - code: SEMANTIC_MISMATCH
          detail: >-
            The model's `activated` maps each feature set to the SET of fired
            neurons; the Java's evaluate() returns only the FIRST fired neuron
            and keeps no per-feature-set state.
        - code: BLOCKED
          detail: >-
            FrozenEthicalFNL.evaluate() iterates java.util.Set.copyOf(...),
            whose iteration order is randomised per JVM run. When more than one
            axiom fires, WHICH neuron reaches Result.firedNeuron() is not
            reproducible across runs, contradicting the class javadoc and
            CONSTITUTION Article I. The class is in a FROZEN zone: fixing it
            needs an explicit RFC and is recorded as an open item.
        - code: NAME_COLLISION
          detail: >-
            io.matrix.multimodal.TextFeatureExtractor is a different class;
            MultimodalTest does not exercise the FROZEN one.
    abstractions:
      - "The model's feature universe is four bits against the Java's sixteen."
    assumptions:
      - "The FROZEN package is read-only for this work; changes there need an RFC."
    limitations:
      - "The canonical trigger relation is not generated from the FROZEN axioms' data."

