    conformance:
      status: [MODEL_CHECKED, ABSTRACT_MODEL, JAVA_UNIT_VERIFIED, INTEGRATION_VERIFIED, PRODUCTION_PATH_VERIFIED]
      gaps:
        - code: SEMANTIC_MISMATCH
          detail: >-
            FnlTriggers is exact set membership on the action text; the Java
            decides on whole-word and phrase feature extraction
            (TextFeatureExtractor.TRIGGERS). "Kill the enemy" is APPROVED by the
            model and REJECTED by the Java — a difference the repository's own
