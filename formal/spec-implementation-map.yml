        - code: SEMANTIC_MISMATCH
          detail: >-
            The model keeps per-bot counters and a per-bot audit chain; the Java
            has global counters and ONE shared HashChain.
        - code: SEMANTIC_MISMATCH
          detail: >-
            The model's audit links are "APPROVE:"/"REJECT:" prefixed texts; the
            Java appends a JSON fingerprint and never stores the action text.
        - code: SEMANTIC_MISMATCH
          detail: >-
            BotsMonotonicExpand asserts the bot set only grows, but
            HeadlessBotRegistry.unregister() exists.
        - code: NO_EXTERNAL_CLIENT
          detail: >-
            The REST endpoint is served, but nothing in the repository consumes
            it, and no @QuarkusTest exercises it over the wire.
    abstractions:
