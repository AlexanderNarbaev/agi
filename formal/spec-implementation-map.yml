# formal/spec-implementation-map.yml — the specification-to-implementation registry
#
# RECON-W39, owner directive §4.1. One authoritative, machine-readable map from
# every TLA+ specification to the Java that implements it, the tests that
# exercise it, and the production path it runs on.
#
# WHY THIS FILE EXISTS
# The TLA+ gate in .github/workflows/tla.yml triggers on formal/** only. A Java
# change could therefore alter a modelled behaviour without any formal check
# running. This registry is the single source of truth for BOTH:
#   * the CI path filter (see ci_paths and the generated block below), and
#   * the conformance status of each specification.
#
# The registry is VALIDATED AUTOMATICALLY by
#   matrix-quality/src/test/java/io/matrix/quality/SpecImplementationMapTest.java
# which checks that every referenced path exists, that every specification has
# tests, that no specification claims PRODUCTION_PATH_VERIFIED without a
# production caller, and that the CI path filter in .github/workflows/tla.yml
# still matches the paths declared here.
#
# Status vocabulary (owner directive §4.2 — do not collapse these):
#   SPECIFICATION_ONLY        a specification with no implementation
#   IMPLEMENTATION_ONLY       an implementation with no specification
#   ABSTRACT_MODEL            the model is a deliberate abstraction of the code
#   MODEL_CHECKED             parsed and model-checked by TLC; properties hold
#   JAVA_UNIT_VERIFIED        Java unit tests cover the implementation
#   TRACE_CONFORMANT          a generated model trace was replayed through Java
#   INTEGRATION_VERIFIED      integration tests exercise it
#   PRODUCTION_PATH_VERIFIED  a live production path uses it
#   BLOCKED                   verification is impossible, and the reason is stated
#   UNVERIFIED                claimed but not demonstrated
#
# A specification may hold several statuses. A specification that is
# MODEL_CHECKED but whose Java correspondence is not demonstrated says so
# explicitly — model checking is evidence about the configured finite model,
# never about the Java implementation.

schema_version: 1

# The closed vocabulary. The validator rejects any status outside this list.
vocabulary:
  status:
    - SPECIFICATION_ONLY
    - IMPLEMENTATION_ONLY
    - ABSTRACT_MODEL
    - MODEL_CHECKED
    - JAVA_UNIT_VERIFIED
    - TRACE_CONFORMANT
    - INTEGRATION_VERIFIED
    - PRODUCTION_PATH_VERIFIED
    - BLOCKED
    - UNVERIFIED

specifications:

  # ───────────────────────────────────────────────────────────────────────────
  - id: MPDTNeuron
    title: "MPDT neuron — the output is a pure function of (k, table, input)"
    spec: formal/MPDTNeuron.tla
    config: formal/MPDTNeuron.cfg
    java:
      module: matrix-core
      sources:
        - matrix-core/src/main/java/io/matrix/neuron/NeuronLayer.java
        - matrix-core/src/main/java/io/matrix/neuron/TruthTable.java
        - matrix-core/src/main/java/io/matrix/neuron/DecisionTree.java
        - matrix-core/src/main/java/io/matrix/bir/TtForm.java
        - matrix-core/src/main/java/io/matrix/bir/BooleanRuntime.java
        - matrix-core/src/main/java/io/matrix/bir/DecisionTreeAdapter.java
        - matrix-core/src/main/java/io/matrix/bir/TruthTableAdapter.java
      production_callers:
        - matrix-core/src/main/java/io/matrix/reasoning/BrcStep.java
        - matrix-core/src/main/java/io/matrix/neuron/HierarchicalBrain.java
        - matrix-core/src/main/java/io/matrix/neuron/NeuralMemoryResponse.java
        - matrix-core/src/main/java/io/matrix/api/OpenAIChatResource.java
        - matrix-core/src/main/java/io/matrix/brain/DefaultBrainPipeline.java
        - matrix-core/src/main/java/io/matrix/agent/AgentLoop.java
        - matrix-core/src/main/java/io/matrix/agent/react/ReActAgentLoop.java
      production_caller_status: PRODUCTION_PATH_VERIFIED
    tests:
      unit:
        - matrix-core/src/test/java/io/matrix/neuron/NeuronLayerTest.java
        - matrix-core/src/test/java/io/matrix/neuron/TruthTableTest.java
        - matrix-core/src/test/java/io/matrix/neuron/DecisionTreeTest.java
        - matrix-core/src/test/java/io/matrix/neuron/SimdTruthTableEvalTest.java
        - matrix-core/src/test/java/io/matrix/neuron/HierarchicalBrainTest.java
        - matrix-core/src/test/java/io/matrix/concurrent/ThreadSafeNeuronLayerTest.java
      integration:
        - matrix-core/src/test/java/io/matrix/integration/BrcIntegrationTest.java
        - matrix-core/src/test/java/io/matrix/integration/EndToEndTest.java
        - matrix-core/src/test/java/io/matrix/integration/BrcMctsIntegrationTest.java
        - matrix-core/src/test/java/io/matrix/integration/RagAgentLoopIntegrationTest.java
    properties:
      invariants: [KMaxIsGlobalCeiling]
      properties: [KBounded, OutputDeterminedByInputs, OutputStableUnderIdempotentInput]
    conformance:
      status: [MODEL_CHECKED, ABSTRACT_MODEL, JAVA_UNIT_VERIFIED, INTEGRATION_VERIFIED, PRODUCTION_PATH_VERIFIED]
      gaps:
        - code: VACUOUS_PROPERTY
          detail: >-
            KBounded and KMaxIsGlobalCeiling cannot fail: k is UNCHANGED in every
            action and Init already constrains k ∈ 1..K_MAX. The cfg pins
            K_MAX = 2 while the Java's real ceiling is TruthTable.K_MAX = 20, so
            widening the Java bound would leave this gate green.
        - code: SEMANTIC_MISMATCH
          detail: >-
            The model has an InvalidInput action that rejects an out-of-range
            index; the Java masks it instead (TruthTable.evaluate: input &
            ((1 << k) - 1); TtForm.eval: input[0] & ((1L << k) - 1)). The Java
            never rejects.
        - code: ABSTRACTION
          detail: >-
            The model allows a per-neuron k; NeuronLayer has ONE shared k for
            the whole layer and rejects heterogeneous tables at build time.
        - code: EXECUTION_PATH
          detail: >-
            The production forward pass does not call TruthTable.evaluate — it
            goes DecisionTreeAdapter.toBir → BooleanRuntime.evaluate → TtForm.eval.
            TruthTable appears on that path only for serialization.
    abstractions:
      - "The model's `outputs` is a memoised cache; the Java has no output field at all — NeuronLayer.evaluate returns a fresh BitSet."
    assumptions:
      - "The BIR runtime evaluates a compiled dense truth table; the model reasons about the table directly."
    limitations:
      - "K_MAX is modelled at 2, not at the Java's 20."

  # ───────────────────────────────────────────────────────────────────────────
  - id: MemoryM4Causal
    title: "M4 causal CRDT — tombstones with epochs, per-key vector clocks"
    spec: formal/MemoryM4Causal.tla
    config: formal/MemoryM4Causal.cfg
    java:
      module: matrix-core
      sources:
        - matrix-core/src/main/java/io/matrix/noosphere/EpochAwareCausalSet.java
        - matrix-core/src/main/java/io/matrix/noosphere/GrowOnlySet.java
        - matrix-core/src/main/java/io/matrix/noosphere/Crdt.java
        - matrix-core/src/main/java/io/matrix/noosphere/CausalCrdt.java
        - matrix-core/src/main/java/io/matrix/noosphere/MeshFederation.java
      production_callers: []
      production_caller_status: NO_PRODUCTION_CALLER
    tests:
      unit:
        - matrix-core/src/test/java/io/matrix/noosphere/EpochAwareCausalSetTest.java
        - matrix-core/src/test/java/io/matrix/noosphere/GrowOnlySetCausalTest.java
        - matrix-core/src/test/java/io/matrix/noosphere/GrowOnlySetPersistenceTest.java
      integration: []
    properties:
      invariants: [TombstoneIrreversible]
      properties:
        - MonotonicityExceptTombstone
        - FrozenImmutability
        - EventualConsistency
        - PresentImpliesUncovered
        - AbsentImpliesCovered
    conformance:
      status: [MODEL_CHECKED, ABSTRACT_MODEL, JAVA_UNIT_VERIFIED]
      gaps:
        - code: NO_PRODUCTION_CALLER
          detail: >-
            GrowOnlySet and CausalCrdt are referenced only by their own classes
            and by tests. MeshFederation's javadoc mentions the CRDT but the
            class uses a ConcurrentHashMap<String,FnlPackage>. The M4 mesh is
            not a replicating system today.
        - code: NOT_TRACE_CONFORMANT
          detail: >-
            No generated model trace has been replayed through the Java yet.
      corrected:
        - code: IMPLEMENTATION_ADDED
          detail: >-
            Before RECON-W39 the Java had NO epoch-aware implementation of this
            model at all: GrowOnlySet stores bare keys, discards the epoch and
            filters tombstones unconditionally (a 2P-Set). EpochAwareCausalSet
            was added so the model has a real counterpart
            (ADR-2026-10-30-004); it carries the frozen-key set as well.
        - code: MODEL_CORRECTED
          detail: >-
            The model's Tombstone action removed the key unconditionally, so a
            tombstone at a stale epoch deleted a strictly newer value. It now
            removes the key only when the tombstone's epoch is at least the
            key's insert epoch, which is the rule EpochAwareCausalSet
            implements.
        - code: MODEL_CORRECTED
          detail: >-
            The model's Merge filtered keys with the RECEIVER's pre-merge
            clock while the same action raised that clock to the merged
            maximum. The two disagreed, so a merge could keep a key the new
            clock says is tombstoned. The filter now uses the merged clock.
    abstractions:
      - "The model has an explicit Freeze action; the Java's frozen-key handling is a flag on the set, not a separate action."
    assumptions:
      - "Replica identity is an opaque constant; the Java's EpochAwareCausalSet is a single replica's state."
    limitations:
      - "The model's per-replica vector clock vc[r][k] is modelled as a single epoch per key per replica."

  # ───────────────────────────────────────────────────────────────────────────
  - id: MctsLatsVisit
    title: "MCTS/LATS search — visit counts, tree shape, arm selection"
    spec: formal/MctsLatsVisit.tla
    config: formal/MctsLatsVisit.cfg
    java:
      module: matrix-core
      sources:
        - matrix-core/src/main/java/io/matrix/mcts/MctsTree.java
        - matrix-core/src/main/java/io/matrix/mcts/MctsNode.java
        - matrix-core/src/main/java/io/matrix/mcts/MctsAction.java
        - matrix-core/src/main/java/io/matrix/mcts/LatsNode.java
        - matrix-core/src/main/java/io/matrix/mcts/LatsValueFunction.java
        - matrix-core/src/main/java/io/matrix/mcts/LatsReflector.java
        - matrix-core/src/main/java/io/matrix/federation/liquid/MCTSPlanner.java
      production_callers:
        - matrix-brain-runtime/src/main/java/io/matrix/brain/runtime/stages/PlanningStage.java
        - matrix-brain-runtime/src/main/java/io/matrix/brain/runtime/stages/ArithmeticStage.java
        - matrix-brain-runtime/src/main/java/io/matrix/brain/runtime/TrueMindCycle.java
        - matrix-api-gateway/src/main/java/io/matrix/api/brain/ProductionBrainClient.java
      production_caller_status: PRODUCTION_PATH_VERIFIED
    tests:
      unit:
        - matrix-core/src/test/java/io/matrix/mcts/MctsTreeTest.java
        - matrix-core/src/test/java/io/matrix/mcts/MctsNodeTest.java
        - matrix-core/src/test/java/io/matrix/mcts/MctsTreeLatsTest.java
        - matrix-core/src/test/java/io/matrix/mcts/MctsLatsConvergenceTest.java
        - matrix-core/src/test/java/io/matrix/mcts/LatsNodeTest.java
        - matrix-core/src/test/java/io/matrix/mcts/LatsReflectorTest.java
        - matrix-core/src/test/java/io/matrix/mcts/LatsValueFunctionTest.java
        - matrix-core/src/test/java/io/matrix/federation/liquid/MCTSPlannerTest.java
        - matrix-brain-runtime/src/test/java/io/matrix/brain/runtime/stages/PlanningStageTest.java
        - matrix-brain-runtime/src/test/java/io/matrix/brain/runtime/PlanningCallerExistsTest.java
      integration:
        - matrix-core/src/test/java/io/matrix/integration/MctsIntegrationTest.java
        - matrix-core/src/test/java/io/matrix/integration/BrcMctsIntegrationTest.java
        - matrix-core/src/test/java/io/matrix/integration/EndToEndTest.java
        - matrix-brain-runtime/src/test/java/io/matrix/brain/runtime/stages/ArithmeticStagePlanningTest.java
        - matrix-brain-runtime/src/test/java/io/matrix/brain/runtime/stages/ArithmeticCompoundRoutingTest.java
    properties:
      invariants: [TypeOK, VisitBudgetRespected]
      properties: [VisitsMonotone, BestArmIsArgmax, TreeAcyclic, SearchTerminates]
    conformance:
      status: [MODEL_CHECKED, ABSTRACT_MODEL, JAVA_UNIT_VERIFIED, INTEGRATION_VERIFIED, PRODUCTION_PATH_VERIFIED]
      gaps:
        - code: WRONG_TARGET
          detail: >-
            The spec's bestArm is an argmax over MEAN reward — the rule of
            io.matrix.federation.liquid.MCTSPlanner.extractBestPath, which has
            NO production caller. The production engine selects by VISIT COUNT
            (MctsTree.runSearch → MctsNode.mostVisitedChild). BestArmIsArgmax
            therefore constrains a class nothing calls, and the rule production
            uses is not modelled.
        - code: SEMANTIC_MISMATCH
          detail: >-
            The model's Visit increments ONE node; the Java's backpropagate
            increments the whole root→leaf ancestor chain, so every node on the
            path ends with the same visit count and mean reward.
        - code: NO_REWARD_SIGNAL
          detail: >-
            The production caller PlanningStage passes a CONSTANT reward
            function - (DecisionTree dt) -> 0.5 - so every simulated rollout
            scores the same and the UCB1 selection has no signal to
            discriminate on. The production search is a bounded deterministic
            random walk over tree mutations, not an optimiser. The measured
            comparison is in ADR-2026-10-30-005: the production search costs
            18.197 us/op against 0.808 us/op for a single greedy step, and
            reaches a LOWER mean reward (2.60 against 3.25) on the benchmark
            problem.
        - code: SEMANTIC_MISMATCH
          detail: >-
            The model's per-node visit budget (Visits) has no Java counterpart;
            the Java bounds total iterations, not per-node visits.
        - code: NO_PRODUCTION_CALLER
          detail: >-
            MCTSPlanner and LatsValueFunction have no production caller.
        - code: SEMANTIC_MISMATCH
          detail: >-
            PlanningStage uses the six-argument MctsTree constructor, which
            hard-codes latsMode = false. The LATS/PUCT selection, the value
            function and the in-search reflection therefore never execute in
            production. The post-search LatsReflector pass DOES run - the
            trace line engine=LatsReflector.reflect is true - but the tree
            that reflection runs over was driven by UCB1, not PUCT, and the
            trace does not say so.
    abstractions:
      - "The model's step set is three concrete functions over a two-bit vector space; the production step is a NeuronLayer with a wider input."
    assumptions:
      - "The convergence claim is probabilistic and is NOT machine-checked; see the Convergence note in the module."
    limitations:
      - "The model cannot express the UCT selection rule used during search; only the final arm selection is modelled."

  # ───────────────────────────────────────────────────────────────────────────
  - id: Consensus
    title: "Consensus — weighted voting over proposals"
    spec: formal/Consensus.tla
    config: formal/Consensus.cfg
    java:
      module: matrix-core
      sources:
        - matrix-core/src/main/java/io/matrix/consensus/ConsensusEngine.java
        - matrix-core/src/main/java/io/matrix/consensus/WeightedVoting.java
        - matrix-core/src/main/java/io/matrix/consensus/Vote.java
        - matrix-core/src/main/java/io/matrix/consensus/Proposal.java
        - matrix-core/src/main/java/io/matrix/consensus/ConsensusLevel.java
      production_callers: []
      production_caller_status: NO_PRODUCTION_CALLER
    tests:
      unit:
        - matrix-core/src/test/java/io/matrix/consensus/ConsensusEngineTest.java
        - matrix-core/src/test/java/io/matrix/consensus/ConsensusTypesTest.java
        - matrix-core/src/test/java/io/matrix/consensus/ConsensusBenchmarkTest.java
        - matrix-core/src/test/java/io/matrix/verification/SafetyPropertiesTest.java
      integration:
        - matrix-core/src/test/java/io/matrix/noosphere/GlobalMediatorTest.java
        - matrix-core/src/test/java/io/matrix/agent/MultiAgentLoopTest.java
        - matrix-core/src/test/java/io/matrix/integration/L1toL5IntegrationTest.java
        - matrix-core/src/test/java/io/matrix/verification/SystemIntegrationTest.java
    properties:
      invariants: [TypeOK]
      properties: [DecisionMonotonic, WeightedIdempotent, LivenessBounded]
    conformance:
      status: [MODEL_CHECKED, ABSTRACT_MODEL, JAVA_UNIT_VERIFIED, INTEGRATION_VERIFIED]
      gaps:
        - code: NO_PRODUCTION_CALLER
          detail: >-
            ConsensusEngine is only instantiated by GlobalMediator and
            MultiAgentLoop, and BOTH are instantiated only by tests. No module
            outside matrix-core references io.matrix.consensus.
        - code: SEMANTIC_MISMATCH
          detail: >-
            The spec's Threshold is an integer VOTE COUNT; the Java has no
            count threshold — WeightedVoting uses a weight ratio
            (APPROVAL_THRESHOLD = 0.5) and ConsensusEngine's simple majority
            uses 2/3. With Threshold = 2, two NO ballots make the model APPROVE
            while the Java REJECTs.
        - code: SEMANTIC_MISMATCH
          detail: >-
            The model's Decisions set has no PENDING state; the Java enum has
            PENDING (not enough votes) and TIMED_OUT.
        - code: NOT_MODELLED
          detail: >-
            The DEBATE strategy and ByzantineConsensus are not modelled. No
            Byzantine fault-tolerance guarantee is claimed.
        - code: NAME_COLLISION
          detail: >-
            io.matrix.federation.consensus.LocalConsensusEngine is a different
            class with a real production caller and its own specification
            (docs-v2/tla/FederationConsensus.tla). It is NOT this model.
    abstractions:
      - "The model has one evaluation strategy (weighted count); the Java has three."
    assumptions:
      - "Votes are by distinct agents in the modelled universe."
    limitations:
      - "No Byzantine or partial-participation behaviour is modelled."

  # ───────────────────────────────────────────────────────────────────────────
  - id: BotEthicsPipeline
    title: "Bot ethics pipeline — FNL verdict, GDPR tombstone, audit chain"
    spec: formal/BotEthicsPipeline.tla
    config: formal/BotEthicsPipeline.cfg
    java:
      module: matrix-core
      sources:
