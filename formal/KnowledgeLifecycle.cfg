\* RECON-W40 — the lifecycle of a learned claim.
\*
\* A deliberately small configuration: two claims, one source, three
\* representations and two abstraction levels. Three representations, so that
\* the "a refined account replaces the account at its level" action is
\* actually reachable. The state space is small on
\* purpose - the point is to check the four promises of the refinement, not
\* to enumerate states.
\*
\* INVARIANTS lists the state predicates. TLC rejects formulas with primes
\* or temporal operators in the INVARIANTS section, so the temporal
\* properties are listed under PROPERTIES.

SPECIFICATION Spec

CONSTANTS
    Claims = {c1, c2}
    Sources = {s1}
    Representations = {r1, r2, r3}
    Levels = {Introductory, Mechanistic}

INVARIANTS
    EvidenceRequired
    SupersededKeepsProposition
    RevisionRecorded
    SingleSuperseder
    RepresentationChainAcyclic

PROPERTIES
    EvidenceAlways
    PropositionAlways
    RevisionAlways
    SupersederAlways

\* The configuration is deliberately small: two claims reach the state where
\* neither can be refined further, and exhausting the state space is the
\* point rather than a failure.
CHECK_DEADLOCK FALSE
