      # formal/** only, so a Java change could alter a modelled behaviour
      # without any model check running. The block below is GENERATED from
      # formal/spec-implementation-map.yml and names every implementation,
      # production caller and test the registry maps. It is regenerated with
      #   ./gradlew :matrix-quality:regenerateFormalPaths
      # and SpecImplementationMapTest fails when it drifts from the map.
      # BEGIN generated-formal-paths (from formal/spec-implementation-map.yml)
