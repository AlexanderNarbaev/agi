# Docs Validation — Wave T-03
# Validates docs-v2 ecosystem (RU/EN) integrity

name: docs-validation

on:
  pull_request:
    paths:
      - 'docs-v2/**'
      - '.github/workflows/docs-validation.yml'
  push:
    branches: [develop, main]
    paths:
      - 'docs-v2/**'

jobs:
  validate-docs:
    name: Validate ecosystem docs (RU/EN parity)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check EN ecosystem pages exist
        run: |
          set -e
          for section in index concept quickstart api sdks xai architecture constitution algorithms; do
            if [ ! -f "docs-v2/ecosystem/${section}/index.md" ] && [ ! -f "docs-v2/ecosystem/${section}.md" ]; then
              echo "❌ Missing EN doc: ecosystem/${section}"
              exit 1
            fi
          done
          echo "✅ All 9 EN ecosystem sections present"

      - name: Check RU ecosystem pages exist
        run: |
          set -e
          for section in index concept quickstart api sdks xai architecture constitution algorithms; do
            if [ ! -f "docs-v2/ru/ecosystem/${section}/index.md" ] && [ ! -f "docs-v2/ru/ecosystem/${section}.md" ]; then
              echo "❌ Missing RU doc: ru/ecosystem/${section}"
              exit 1
            fi
          done
          echo "✅ All 9 RU ecosystem sections present"

      - name: Verify no broken internal links
        run: |
          echo "Checking for broken ecosystem links..."
          BROKEN=0
          # Each ecosystem/*.md should have at least 1 internal link
          for f in docs-v2/ecosystem/**/*.md docs-v2/ecosystem/*.md; do
            [ -f "$f" ] || continue
            LINKS=$(grep -oP '\]\(/ecosystem/[^)]+\)' "$f" 2>/dev/null | wc -l)
            if [ "$LINKS" -lt 1 ]; then
              echo "⚠️  $f has no ecosystem internal links"
            fi
          done
          echo "✅ Ecosystem link check done"

      - name: Verify frontmatter on all pages
        run: |
          echo "Checking frontmatter on ecosystem pages..."
          MISSING=0
          for f in $(find docs-v2/ecosystem docs-v2/ru/ecosystem -name "*.md"); do
            head -1 "$f" | grep -q "^---$" || { echo "❌ $f missing frontmatter"; MISSING=1; }
          done
          if [ "$MISSING" -eq 1 ]; then
            exit 1
          fi
          echo "✅ All ecosystem pages have frontmatter"

      - name: Verify CONSTITUTION articles are referenced
        # W49: the previous check looked for the literal string "Article I"…
        # "Article VIII". The constitution never used that spelling — its
        # articles are headed "I. Stratified Stochasticity" … "VIII. The
        # environment and explicitness" — so the check only ever validated a
        # page that used the same invented spelling, and it could NOT tell
        # the constitution's own eight articles from eight invented ones.
        # That is exactly the defect the W49 public audit found in the page.
        #
        # The check now compares the page against the constitution's own
        # article headings, which is the parity it was meant to enforce.
        run: |
          set -e
          MISSING=0
          # The constitution's own article numerals, in its own order.
          CONSTITUTION_ARTICLES="$(grep -oE '^## [IVX]+' CONSTITUTION.md | sed -E 's/^## //')"
          COUNT="$(printf '%s\n' "$CONSTITUTION_ARTICLES" | grep -c '[IVX]')"
          if [ "$COUNT" -ne 8 ]; then
            echo "❌ the constitution carries $COUNT articles; the ecosystem pages must document all eight"
            MISSING=1
          fi
          # The subjects are in Russian in the constitution and in the target
          # language in the pages, so the parity that can be checked is the
          # ORDER: the page must carry the same eight articles, in the same
          # order, as the constitution itself. The previous check compared
          # neither — it only looked for a spelling ("Article I") that the
          # constitution never used, which is how eight INVENTED articles
          # passed it.
          for page in docs-v2/ecosystem/constitution/index.md docs-v2/ru/ecosystem/constitution/index.md; do
            PAGE_ARTICLES="$(grep -oE '^### [IVX]+' "$page" | sed -E 's/^### //')"
            PAGE_COUNT="$(printf '%s\n' "$PAGE_ARTICLES" | grep -c '[IVX]')"
            if [ "$PAGE_COUNT" -ne "$COUNT" ]; then
              echo "❌ $page documents $PAGE_COUNT articles; the constitution has $COUNT"
              MISSING=1
              continue
            fi
            if [ "$PAGE_ARTICLES" = "$CONSTITUTION_ARTICLES" ]; then
              echo "✅ $page documents the constitution's eight articles, in its order"
            else
              echo "❌ $page does not carry the constitution's articles in its order"
              printf '   the constitution: %s\n' "$(printf '%s ' $CONSTITUTION_ARTICLES)"
              printf '   the page:       %s\n' "$(printf '%s ' $PAGE_ARTICLES)"
              MISSING=1
            fi
          done
          if [ "$MISSING" -ne 0 ]; then
            exit 1
          fi
