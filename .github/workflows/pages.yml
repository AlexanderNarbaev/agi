# MATRIX GitHub Pages — bilingual documentation deployment

name: MATRIX Pages

on:
  push:
    branches: [main]
    paths:
      - 'docs/index*.html'
      - 'docs/index*.md'
      - 'docs/docs*.html'
      - 'docs/algorithms*.html'
      - 'docs/benchmarks*.html'
      - 'docs/research*.html'
      - 'docs/sandbox.html'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build site
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@v5

      - name: Verify all bilingual pages exist
        run: |
          echo "Verifying multi-page bilingual site..."
          PAGES=(
            docs/index.html
            docs/index.en.html
            docs/index.en.md
            docs/docs.html
            docs/docs.en.html
            docs/algorithms.html
            docs/algorithms.en.html
            docs/benchmarks.html
            docs/benchmarks.en.html
            docs/research.html
            docs/research.en.html
          )
          FAIL=0
          for f in "${PAGES[@]}"; do
            if [ ! -f "$f" ]; then
              echo "ERROR: Missing $f"
              FAIL=1
            else
              SIZE=$(wc -c < "$f")
              echo "OK: $f ($SIZE bytes)"
            fi
          done
          if [ $FAIL -eq 1 ]; then
            echo "SOME PAGES MISSING"
            exit 1
          fi
          echo "All pages present"

      - name: Verify lang attributes
        run: |
          for f in docs/index.html docs/docs.html docs/algorithms.html docs/benchmarks.html docs/research.html; do
            grep -q '<html lang="ru"' "$f" && echo "RU: $f OK" || (echo "RU: $f MISSING lang" && exit 1)
          done
          for f in docs/index.en.html docs/docs.en.html docs/algorithms.en.html docs/benchmarks.en.html docs/research.en.html; do
            grep -q '<html lang="en"' "$f" && echo "EN: $f OK" || (echo "EN: $f MISSING lang" && exit 1)
          done

      - name: Verify cross-links
        run: |
          # Check that EN pages link to RU and vice versa
          grep -q 'lang-switcher' docs/index.html && echo "index.html has lang switcher OK"
          grep -q 'lang-switcher' docs/index.en.html && echo "index.en.html has lang switcher OK"

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4