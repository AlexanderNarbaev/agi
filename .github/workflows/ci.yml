# WAVE T-09 — Full CI/CD Pipeline
# Runs on every push to develop/main + every PR
# Stages: Build → Test → Scan (security) → Deploy (staging/prod)

name: ci

on:
  push:
    branches: [develop, main, release/**]
  pull_request:
    branches: [develop, main, release/**]
  workflow_dispatch:

env:
  GRADLE_OPTS: "-Xmx8g -Dorg.gradle.daemon=false"
  JAVA_HOME: /opt/hostedtoolcache/Java_Temurin-Hotspot_jdk/25.0.1.6/Contents/Home

jobs:
  # Stage 1: Build + Test (Java modules)
  build-test:
    name: Build & Test (Java)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: gradle

      - name: Compile all modules
        run: ./gradlew compileJava compileTestJava --no-daemon

      - name: Run unit tests
        run: ./gradlew test --no-daemon

      - name: Verify CONSTITUTION compliance (no LLM imports)
        run: |
          echo "Checking production runtime paths for LLM imports..."
          ! grep -rE "import (openai|anthropic|cohere|google.generativeai)" \
             matrix-api-gateway/src/main matrix-sdk-java/src/main pilots/*/src/main \
             matrix-audit/src/main matrix-billing/src/main matrix-observability/src/main \
             2>/dev/null && echo "✅ No LLM imports in production runtime paths"

      - name: Build native binary (api-gateway)
        run: ./gradlew :matrix-api-gateway:nativeCompile --no-daemon
        continue-on-error: true   # Native build requires special image; skip in CI

      - name: Upload coverage
        if: matrix.event_name == 'push'
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: '**/build/reports/jacoco/test/html'

  # Stage 2: Security scan
  security:
    name: Security Scan
    runs-on: ubuntu-latest
    needs: build-test
    steps:
      - uses: actions/checkout@v4

      - name: SpotBugs static analysis
        run: ./gradlew :matrix-core:spotbugsMain :matrix-core:spotbugsTest --no-daemon
        continue-on-error: true

      - name: Check for secrets in code
        uses: trufflesecurity/trufflehog@main
        with:
          path: ./
          base: ${{ github.ref }}
          head: HEAD
        continue-on-error: true

      - name: OWASP dependency check
        run: |
          # Lightweight manual check: verify no known-vulnerable deps
          ./gradlew dependencies --configuration runtimeClasspath --no-daemon | tee /tmp/deps.txt
          if grep -i "log4j-core" /tmp/deps.txt; then
            echo "❌ log4j-core detected (CVE-2021-44228)"
            exit 1
          fi
          echo "✅ No known-vulnerable dependencies"

  # Stage 3: Build Docker images (on develop/main)
  docker:
    name: Docker Build & Push
    runs-on: ubuntu-latest
    needs: [build-test, security]
    if: github.event_name == 'push' && (github.ref == 'refs/heads/develop' || github.ref == 'refs/heads/main')
    strategy:
      matrix:
        service: [api-gateway, web-ui]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          file: deploy/docker/Dockerfile.${{ matrix.service }}
          push: true
          tags: |
            alexandernarbaev/matrix-${{ matrix.service }}:${{ github.sha }}
            alexandernarbaev/matrix-${{ matrix.service }}:latest

  # Stage 4: Deploy to staging (on develop)
  deploy-staging:
    name: Deploy to Staging
    runs-on: ubuntu-latest
    needs: docker
    if: github.ref == 'refs/heads/develop'
    environment: staging
    steps:
      - uses: actions/checkout@v4

      - name: Configure kubectl
        uses: azure/k8s-set-context@v4
        with:
          method: kubeconfig
          kubeconfig: ${{ secrets.K8S_STAGING_KUBECONFIG }}

      - name: Deploy with Helm
        run: |
          helm upgrade --install matrix-staging deploy/helm/matrix \
            --namespace matrix-staging --create-namespace \
            --set image.tag=${{ github.sha }} \
            --set secrets.stripeWebhookSecret=${{ secrets.STRIPE_WEBHOOK_SECRET }} \
            --set secrets.licenseSigningSecret=${{ secrets.LICENSE_SIGNING_SECRET }} \
            --wait --timeout 5m

      - name: Run smoke tests
        run: |
          sleep 30
          curl -f https://staging-api.matrix.ai/q/health || exit 1
          echo "✅ Staging deployment healthy"

  # Stage 5: Deploy to production (on main, manual approval)
  deploy-prod:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: docker
    if: github.ref == 'refs/heads/main'
    environment:
      url: https://api.matrix.ai
      name: production
    steps:
      - uses: actions/checkout@v4

      - name: Configure kubectl
        uses: azure/k8s-set-context@v4
        with:
          method: kubeconfig
          kubeconfig: ${{ secrets.K8S_PROD_KUBECONFIG }}

      - name: Deploy with Helm
        run: |
          helm upgrade --install matrix-prod deploy/helm/matrix \
            --namespace matrix-prod \
            --set image.tag=${{ github.sha }} \
            --set secrets.stripeWebhookSecret=${{ secrets.STRIPE_WEBHOOK_SECRET_PROD }} \
            --set secrets.licenseSigningSecret=${{ secrets.LICENSE_SIGNING_SECRET_PROD }} \
            --wait --timeout 10m

      - name: Verify deployment
        run: |
          sleep 60
          curl -f https://api.matrix.ai/q/health || exit 1
          echo "✅ Production deployment healthy"
