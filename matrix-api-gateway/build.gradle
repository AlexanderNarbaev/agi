// matrix-api-gateway/build.gradle — Wave T-02 entry point
// Quarkus REST as primary choice (CONSTITUTION-aligned: same stack as matrix-core)
// Spring Boot support added in T-02 if benchmark shows need

plugins {
    id 'java'
    id 'jacoco'
    // RECON-W38.4: this module needs a runnable, self-contained distribution.
    // The previous deploy/docker/Dockerfile.api-gateway invoked
    // :matrix-api-gateway:nativeCompile — a task that does not exist here
    // (the module applies no GraalVM plugin), so the gateway image could
    // never be built and CI hid the failure behind continue-on-error.
    // `application` + installDist produces a real, runnable distribution:
    //   ./gradlew :matrix-api-gateway:installDist
    //   matrix-api-gateway/build/install/matrix-api-gateway/bin/matrix-api-gateway
    id 'application'
}

group = 'io.matrix'
version = '0.1.0-T02-SNAPSHOT'

// The gateway's own entry point: a JDK HttpServer serving the REST facade.
// The JAX-RS resources in io.matrix.api.resource are deliberately not mounted
// (the module applies no Quarkus plugin), so this is the real entry point.
application {
    mainClass = 'io.matrix.api.MinimalHttpServer'
    applicationDefaultJvmArgs = [
        '--add-modules=jdk.incubator.vector',
        '--enable-native-access=ALL-UNNAMED'
    ]
}

java {
    sourceCompatibility = JavaVersion.VERSION_25
    targetCompatibility = JavaVersion.VERSION_25
}

repositories {
    mavenCentral()
}

dependencies {
    // MIND-W1: Cognitive Orchestration Layer
    // MindCycle + BRC trace + arithmetic + analogy + FROZEN modulators.
    // (Brings in matrix-core transitively; we now WANT direct linkage since
    // matrix-brain-runtime is the dedicated runtime module.)
    implementation project(':matrix-brain-runtime')
    // RECON-W2: direct dep on matrix-core so gateway can reference
    // SafetyMonitor + EthicalFilter when wiring RealAuditService.
    implementation project(':matrix-core')
    // RECON-W0 D-11: wire /v1/audit/logs to matrix-audit HashChainedLog
    implementation project(':matrix-audit')

    // Quarkus REST stack (matches matrix-core for consistency)
    implementation enforcedPlatform('io.quarkus.platform:quarkus-bom:3.38.3')
    implementation 'io.quarkus:quarkus-arc'
    implementation 'io.quarkus:quarkus-rest'
    implementation 'io.quarkus:quarkus-rest-jackson'
    implementation 'io.quarkus:quarkus-hibernate-validator'
    implementation 'io.quarkus:quarkus-smallrye-health'
    implementation 'io.quarkus:quarkus-micrometer-registry-prometheus'
    implementation 'io.quarkus:quarkus-websockets'
    implementation 'io.quarkus:quarkus-oidc'
    implementation 'io.quarkus:quarkus-redis-client'

    // OpenAPI
    implementation 'io.quarkus:quarkus-smallrye-openapi'

    testImplementation 'io.quarkus:quarkus-junit5'
    testImplementation 'org.assertj:assertj-core:3.26.0'
}

tasks.withType(Test) {
    useJUnitPlatform()
    maxHeapSize = '4g'
    // RECON-W20: matrix-brain-runtime's RealGpuKernelEngine -> MatrixNativeMath
    // loads the jdk.incubator.vector module at class-init. Without this flag the
    // gateway test JVM throws NoClassDefFoundError(jdk/incubator/vector/Vector)
    // and 4 wiring tests fail for a reason unrelated to what they assert.
    // matrix-core already sets this for its own test task; the gateway did not.
    jvmArgs '--add-modules=jdk.incubator.vector'
    jvmArgs '--enable-native-access=ALL-UNNAMED'
}

// RECON-W0: write a reproducible runtime classpath to build/runtime-classpath.txt.
// start-mind.sh consumes this file instead of grepping the gradle cache.
tasks.register('writeRuntimeClasspath') {
    doLast {
        def cp = configurations.runtimeClasspath.resolve().collect { it.toString() }.join(':')
        def out = file("$buildDir/runtime-classpath.txt")
        out.text = cp
        println "Runtime classpath written to: $out"
        println "Entries: ${configurations.runtimeClasspath.resolve().size()}"
    }
}

// RECON-W28 B-3: this module has no JaCoCo plugin, so the campaign produced NO
// coverage evidence for code it changed. matrix-core already measures an 82%
// METHOD gate; without the same measurement here, "coverage >= 82% on touched
// modules" was an unverifiable claim. Reports only - the 82% gate stays in
// matrix-core, which owns the bundle-level contract, so a module-wide number
// here cannot silently fail the build for pre-existing untested surface.
jacocoTestReport {
    reports {
        xml.required = true
        html.required = true
    }
}
