// matrix-brain-runtime/build.gradle — MIND-W1
// Cognitive Orchestration Layer: MindCycle (the conductor) +
// BRC reasoning trace + arithmetic composition + analogy by HDC similarity
//
// CONSTITUTION Article I: NO LLM in runtime. Pure deterministic MATRIX-native.

plugins {
    id 'java'
    id 'jacoco'
    id 'application'
}

group = 'io.matrix'
version = '0.1.0-MIND-W1'

java {
    sourceCompatibility = JavaVersion.VERSION_25
    targetCompatibility = JavaVersion.VERSION_25
}

repositories {
    mavenCentral()
}

dependencies {
    // FROZEN research core (article V: read-only, no mutation)
    implementation project(':matrix-core')

    // Audit chain (matrix-audit HashChainedLog + GdprPruner)
    implementation project(':matrix-audit')

    // Prometheus metrics + healthchecks
    implementation project(':matrix-observability')

    // JSON for REST DTO
    implementation 'com.fasterxml.jackson.core:jackson-databind:2.18.2'

    testImplementation 'org.junit.jupiter:junit-jupiter:5.11.4'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher:1.11.4'
    testImplementation 'org.assertj:assertj-core:3.26.0'
    testImplementation 'com.google.protobuf:protobuf-java:3.25.5'
}

application {
    mainClass = 'io.matrix.brain.runtime.MindRuntimeCli'
}

tasks.withType(Test) {
    useJUnitPlatform()
    maxHeapSize = '2g'
}

// RECON-W28 B-3: this module has no JaCoCo plugin, so the campaign produced NO
// coverage evidence for code it changed. matrix-core already measures an 82%
// METHOD gate; without the same measurement here, "coverage >= 82% on touched
// modules" was an unverifiable claim. Reports only - the 82% gate stays in
// matrix-core, which owns the bundle-level contract, so a module-wide number
// here cannot silently fail the build for pre-existing untested surface.
jacocoTestReport {
    reports {
        xml.required = true
        html.required = true
    }
}
